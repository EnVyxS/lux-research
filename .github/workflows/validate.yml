name: validate

# S5. Memeriksa integritas seluruh aset Tier B per simbol, lalu menerapkan
# ambang kelayakan dari config/lux.yaml untuk membentuk universe backtest.
#
# Ambang ditulis sebelum data dilihat. Jumlah simbol yang lolos dicatat apa pun
# hasilnya, termasuk bila jauh lebih kecil dari 790.
#
# Percobaan 3. Percobaan 1 mati di gerbang pengujian (bingkai uji tidak selaras
# batas hari UTC). Percobaan 2 berjalan penuh tetapi membaca aset `_retry`
# pra-perbaikan parser yang masih tertinggal di Release, sehingga tiga simbol
# non-ASCII terhitung dua kali: 12.593 baris berlebih, tepat sama dengan isi
# aset usang itu. Kini aset tersebut dihapus dari Release sekaligus disaring
# di dalam kode.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate.yml'

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt pyyaml pytest

      - name: Uji dulu, baru unduh
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Hapus aset usang dari release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          usang=$(gh release view "$TAG" --json assets \
            --jq '.assets[].name | select(test("_retry"))' || true)
          if [ -z "$usang" ]; then
            echo "tidak ada aset usang"
          else
            echo "$usang" | while read -r nama; do
              echo "menghapus $nama"
              gh release delete-asset "$TAG" "$nama" -y
            done
          fi

      - name: Unduh aset Parquet 1h dari release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p aset
          gh release download "$TAG" -p 'ohlcv_1h_*.parquet' -D aset --clobber
          ls -la aset
          du -sh aset

      - name: Validasi
        env:
          PYTHONPATH: .
        run: |
          python -m lux.validate_run \
            --dir aset \
            --interval 1h \
            --config config/lux.yaml \
            --out reports

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-validate"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "data(validate): laporan validasi run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
