name: analyze-tail

# Menelusuri anomali backfill ekor tanpa mengunduh ulang data apa pun.
# Artifact run backfill terakhir sudah memuat metrik per simbol; runner
# mengambilnya lewat gh CLI, menganalisisnya, lalu meng-commit hasilnya.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze_tail.yml'

permissions:
  contents: write
  actions: read

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unduh artifact backfill terakhir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN=$(gh run list --workflow=backfill_daily.yml --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          echo "run backfill terakhir: $RUN"
          mkdir -p shards
          gh run download "$RUN" -p 'laporan-tail-*' -D shards
          echo "berkas detail: $(find shards -name 'detail_tail_*.json' | wc -l)"

      - name: Analisis
        env:
          PYTHONPATH: .
        run: python -m lux.analyze_tail shards

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-analyze"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "chore(analyze): anomali ekor harian [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
