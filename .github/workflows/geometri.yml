name: geometri

# Diagnostik pasca-vonis, bukan hipotesis baru.
#
# H-012 sudah DITOLAK (p 0,04171275623950187 < 0,05). Yang belum dijelaskan adalah
# satu perdagangan -21,3131R pada laporan yang sama, padahal invarian risiko
# seharusnya memaku kerugian di sekitar -1R. Selama sebabnya tidak diketahui, ia
# adalah lubang di MESIN, dan mesin yang berlubang membuat setiap hipotesis
# berikutnya - termasuk H-013 - tidak dapat dipercaya apa pun hasilnya.
#
# Workflow ini tidak menjalankan backtest dan tidak mengunduh apa pun. Masukannya
# berkas laporan yang sudah dikomit. Karena itu ia tidak dapat menghasilkan angka
# baru bagi H-012, hanya membaca sebab dari angka yang sudah beku.
#
# Ambang -1,5R dan keempat ramalan Bagian A dibekukan di decisions/ADR-015 SEBELUM
# laporan ini dibaca. Bila hasilnya melawan dugaan, yang gugur adalah dugaannya.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/geometri.yml"

permissions:
  contents: write

jobs:
  geometri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: siap
        run: mkdir -p logs reports

      # Aturan 34: lingkungan pagar memasang dependensi yang sama dengan tests.yml.
      - name: deps
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee -a logs/deps.log
          pip install -r requirements.txt pytest 2>&1 | tee -a logs/deps.log

      # Aturan 1: pengujian modul hijau sebelum keluarannya dipercaya.
      - name: uji
        run: |
          set -o pipefail
          python -m pytest -q tests/test_geometri_keluar.py 2>&1 | tee -a logs/uji.log

      # Aturan 5: berkas masukan wajib ADA. Laporan tanpa berkas hasil adalah GAGAL,
      # dan diagnostik yang berjalan atas berkas kosong lebih buruk lagi sebab ia
      # menghasilkan kesimpulan yang terlihat sah.
      - name: pastikan masukan ada
        run: |
          set -o pipefail
          ls -l reports/backtest_h012_periode_tertahan.json 2>&1 | tee -a logs/geometri.log

      - name: jalankan diagnostik
        run: |
          set -o pipefail
          python -m lux.analisis.geometri_keluar \
            --laporan reports/backtest_h012_periode_tertahan.json \
            --out reports/geometri_keluar_h012.md 2>&1 | tee -a logs/geometri.log

      - name: tampilkan hasil
        if: always()
        run: |
          set -o pipefail
          cat reports/geometri_keluar_h012.md 2>&1 | tee -a logs/geometri.log \
            || echo "(berkas hasil TIDAK ADA - run GAGAL sebelum selesai)" \
              | tee -a logs/geometri.log

      # Aturan 33: seluruh logs/ disalin ke reports/ apa pun yang terjadi, sebab
      # log runner tidak dapat saya baca dan yang tidak dikomit tidak ada.
      - name: Salin log ke laporan
        if: always()
        run: |
          {
            echo "# Log diagnostik geometri keluar"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo
            for berkas in logs/*.log; do
              [ -f "$berkas" ] || continue
              echo "## $berkas"
              echo '```'
              cat "$berkas"
              echo '```'
              echo
            done
          } > reports/geometri_log.md

      - name: Komit hasil
        if: always()
        run: |
          git config user.name lux-geometri
          git config user.email actions@github.com
          git add reports/geometri_keluar_h012.md reports/geometri_log.md
          git commit -m "chore(geometri): diagnostik keluar ${GITHUB_RUN_ID} [skip ci]" \
            || echo "tidak ada perubahan untuk dikomit"
          # Tanpa rebase, dua workflow yang selesai berdekatan saling menelan bukti:
          # push kedua ditolak non-fast-forward dan laporannya hilang tanpa jejak.
          git pull --rebase --autostash origin main
          git push
