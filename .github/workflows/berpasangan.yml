name: berpasangan

# Jalur A ADR-026: uji tanda berpasangan tingkat simbol dan bulan atas selisih
# antar sel H-013.
#
# Workflow ini TIDAK menjalankan backtest dan tidak menyentuh jaringan. Ia hanya
# membaca empat JSON laporan sel yang sudah dikomit oleh run 30214203863, jadi
# hasilnya dapat diulang persis tanpa mengunduh apa pun. Alasan ia ada sebagai
# workflow, bukan dijalankan di mesin lokal: berkas selnya masing-masing ~432 KB
# dan mesin lokal tidak dipakai sebagai penghitung dalam proyek ini.
#
# Yang dijawab laporan ini: apakah selisih SS-AS bertahan ketika simbol atau
# bulan diperlakukan sebagai satuan penarikan. Yang TIDAK dijawab: p permutasi
# sinyal ADR-015 pasal 4.4 - itu Jalur B, dan hanya Jalur B yang boleh melahirkan
# putusan H-013.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/berpasangan.yml'

permissions:
  contents: write

jobs:
  jalur_a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Pagar pra-terbang
        env:
          PYTHONPATH: .
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          from lux.analisis import berpasangan as bp

          # 1. Pembatas wajib ada dan wajib menyebut ADR-015 pasal 4.4.
          assert "ADR-015" in bp.PEMBATAS, "pembatas kehilangan rujukan ADR-015"
          assert "MENJATUHKAN" in bp.PEMBATAS, "pembatas kehilangan arah pemakaian"

          # 2. Modul ini tidak boleh pernah memancarkan kelulusan ADR-015, bahkan
          #    ketika besaran selisihnya besar sekali.
          hasil = bp.ringkas(
              bp.pasangkan(
                  [{"symbol": "A", "ekspektasi_R": 9.0, "trade": 10, "total_R": 90.0},
                   {"symbol": "B", "ekspektasi_R": 8.0, "trade": 10, "total_R": 80.0},
                   {"symbol": "C", "ekspektasi_R": 7.0, "trade": 10, "total_R": 70.0}],
                  [{"symbol": "A", "ekspektasi_R": 0.0, "trade": 10, "total_R": 0.0},
                   {"symbol": "B", "ekspektasi_R": 0.0, "trade": 10, "total_R": 0.0},
                   {"symbol": "C", "ekspektasi_R": 0.0, "trade": 10, "total_R": 0.0}],
                  "symbol",
              ),
              ambang=0.020,
              ulangan=200,
          )
          assert hasil["melewati_ambang_besaran"] is True
          assert hasil["memenuhi_adr015"] is False, "modul memancarkan kelulusan"

          # 3. Empat berkas sel wajib ada sebelum apa pun dihitung.
          for nama in (
              "backtest_h013_ss_sinyal_stop.json",
              "backtest_h013_sh_sinyal_horizon.json",
              "backtest_h013_as_acak_stop.json",
              "backtest_h013_ah_acak_horizon.json",
          ):
              p = Path("reports") / nama
              assert p.is_file() and p.stat().st_size > 100_000, f"sel hilang: {nama}"

          print("pagar pra-terbang lulus", flush=True)
          PY

      - name: SS lawan AS (sumbangan sinyal)
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m lux.analisis.berpasangan \
            --sel-a reports/backtest_h013_ss_sinyal_stop.json \
            --sel-b reports/backtest_h013_as_acak_stop.json \
            --nama h013_berpasangan_ss_as \
            --ambang 0.020 \
            --ulangan 10000 \
            --out reports > /tmp/ss_as.txt 2>&1
          tail -n 40 /tmp/ss_as.txt

      - name: SH lawan AH (anomali sel tanpa target)
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m lux.analisis.berpasangan \
            --sel-a reports/backtest_h013_sh_sinyal_horizon.json \
            --sel-b reports/backtest_h013_ah_acak_horizon.json \
            --nama h013_berpasangan_sh_ah \
            --ambang 0.020 \
            --ulangan 10000 \
            --out reports > /tmp/sh_ah.txt 2>&1
          tail -n 40 /tmp/sh_ah.txt

      - name: Tegakkan berkas hasil lahir
        run: |
          set -e
          for f in \
            reports/h013_berpasangan_ss_as.json \
            reports/h013_berpasangan_ss_as.md \
            reports/h013_berpasangan_sh_ah.json \
            reports/h013_berpasangan_sh_ah.md ; do
            test -s "$f" || { echo "berkas hasil tidak lahir: $f"; exit 1; }
          done
          grep -q "ADR-015" reports/h013_berpasangan_ss_as.md
          grep -q "TIDAK" reports/h013_berpasangan_ss_as.md

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-berpasangan"
          git config user.email "actions@github.com"
          git add reports/h013_berpasangan_ss_as.json \
                  reports/h013_berpasangan_ss_as.md \
                  reports/h013_berpasangan_sh_ah.json \
                  reports/h013_berpasangan_sh_ah.md
          git diff --cached --quiet && { echo "tidak ada perubahan hasil"; exit 1; }
          git commit -m "chore(analisis): laporan Jalur A ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
