# Menjalankan H-013 (ADR-015 bagian B, ADR-020 sampai ADR-023) di GitHub Actions
# dan MENGOMIT hasilnya balik ke reports/, karena log workflow tidak dapat dibaca
# dari sandbox dan tidak ada satu pun fungsi Actions yang tersedia. Berkas laporan
# yang dikomit adalah satu-satunya kanal keluaran yang dapat diaudit.
#
# Dipicu lewat filter paths pada berkasnya sendiri. Akibatnya push berkas ini
# LANGSUNG memulai run, jadi ia selalu dibalik paling akhir, sesudah seluruh modul
# hijau sendiri. Untuk H-013 itu terjadi tiga kali: 734, 737, lalu 739 pengujian.
#
# H-013 BUKAN "H-010 setelah perbaikan", dan bukan pula H-012 yang diulang.
# Pertanyaannya baru dan belum pernah ditanyakan dalam dua belas hipotesis: apakah
# SINYALNYA sendiri menyumbang sesuatu. Yang dinilai adalah selisih antar empat sel
# - SS, SH, AS, AH - bukan kelulusan satu sel. Sel SH, AS, dan AH adalah pembanding
# dan memang tidak dimaksudkan lulus.
#
# DUA HAL YANG AKAN TAMPAK SEPERTI KEGAGALAN DAN BUKAN KEGAGALAN:
#
#   1. lookahead dan entri_acak DIJAMIN gagal pada sel AS dan AH. Permutasi
#      bergantung panjang array, sedangkan gerbang lookahead memotong data lalu
#      menuntut sinyal awal tidak berubah. Itu konsekuensi konstruksi (ADR-021),
#      diputuskan sebelum run, dan haram dilaporkan sebagai temuan.
#
#   2. invarian_risiko diramalkan jatuh pada sel SH dan AH. Sebabnya jalur umur
#      mengisi pada harga bar sungguhan sedangkan jalur stop hanya seburuk celah
#      pembukaan. Itu BUKAN bukti target lebih baik, dan ambang -1,5R tidak
#      dilonggarkan karenanya.
#
# --komit sengaja TIDAK diteruskan ke orkestrator: yang mengomit adalah langkah di
# bawah, sekali, sesudah seluruh berkas hasil ada. Laporan yang dikomit tanpa
# backtest_h013_kontribusi.json berarti run GAGAL, bukan hasil yang tak ternilai.
#
# LIMA KEGAGALAN, DICATAT KARENA POLANYA BELUM KEDALUWARSA:
#
#   30198306280 (25s) mati di langkah uji, dan buktinya HILANG karena hanya
#   logs/backtest.log yang disalin - berkas yang belum pernah ada bila
#   kegagalannya mendahului langkah jalan.
#
#   30198631730 (23s) mati di langkah uji juga: "No module named pytest".
#
#   30198840830 (25s) mati di pagar: Konfig tidak punya medan fee_efektif.
#   fee_efektif adalah kunci YAML; medan dataclass-nya bernama fee.
#
#   30198942815 (32s) LULUS kedelapan pagar, mengunduh 559M, lalu mati di
#   orkestrator dengan AttributeError fee_efektif yang sama. Pagar MENYALIN bug
#   dari kode yang dijaganya, jadi ia tidak menjaga apa pun.
#
#   30213913942 mati di pagar butir 3 baris 65: maks_biaya_masuk_R pada Konfig
#   ternyata 0.0 meskipun config/lux.yaml memuat 0.5. Sebabnya dibaca, bukan
#   ditebak: muat_konfig_h002 memetakan delapan kunci dan tidak menyentuh
#   maks_biaya_masuk_R maupun stop_hormati_celah. Dua pengaman yang saya andaikan
#   menyala sesungguhnya MATI di sepanjang jalur config. Pagar tidak diturunkan;
#   dasar_riset yang memasang keduanya.
#
# Tiga yang pertama satu kelas: nama atau lingkungan yang DITEBAK alih-alih dibaca.
# Yang keempat kelas kedua: pagar yang menyalin. Yang kelima kelas ketiga: angka yang
# hidup di berkas config tetapi tidak di dalam program. Karena itu pagar di bawah
# MEMANGGIL fungsi modul - dasar_riset, jendela_bar, bar_dibutuhkan, buat_konfig_sel,
# permutasi_sinyal - dan setiap langkah menulis keluarannya ke logs/, lalu seluruh
# logs/ disalin ke reports/ dengan if: always().

name: backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah simbol; 0 berarti seluruh semesta layak"
        default: "0"
      ulangan:
        description: "Ulangan permutasi entri acak; H-013 menolak di bawah 300"
        default: "300"
  push:
    paths:
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: siap
        name: Siapkan direktori log
        run: mkdir -p logs reports

      - id: deps
        name: Pasang dependensi
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            pip install -r requirements.txt pytest
            python -c "import numpy, pandas, pyarrow, yaml; print('numpy', numpy.__version__)"
            python -c "import pytest; print('pytest', pytest.__version__)"
          } 2>&1 | tee logs/deps.log

      - id: uji
        name: Pytest wajib hijau sebelum apa pun diunduh
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee logs/uji.log

      - id: impor
        name: Pagar pra-terbang H-013
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee logs/preflight.log
          import dataclasses
          import inspect
          from pathlib import Path

          import numpy as np

          from lux.backtest import engine, gerbang, run_h009, run_h010, run_h013, runner
          from lux.backtest.run_h002 import muat_konfig_h002
          from lux.backtest.run_h007 import LOOKBACK as LOOKBACK_H007
          from lux.backtest.run_h012 import kunci_config
          from lux.degenerasi import AMBANG_BIAYA_MASUK_R, AMBANG_MIN_STOP_FRAC
          from lux.strategi import breakout_atr

          KONFIG = Path("config/lux.yaml")


          def bawaan(cls, nama):
              """Nilai bawaan yang DIDEKLARASIKAN pada medan dataclass.

              Sengaja tidak membangun instans. Aturan 9 menjaga nilai bawaan pada
              definisi medan, bukan nilai pada satu objek yang kebetulan dibangun.
              """
              for f in dataclasses.fields(cls):
                  if f.name == nama:
                      return f.default
              raise AssertionError(f"{cls.__name__} tidak punya medan {nama}")


          # 1. Mekanisme diimpor TANPA perubahan. Bila sinyal atau konfig ternyata
          #    salinan, selisih antar sel akan mengukur perbedaan salinan itu.
          assert run_h013.sinyal_sel("SS") is breakout_atr.sinyal
          assert run_h013.sinyal_sel("SH") is breakout_atr.sinyal
          assert run_h013.sinyal_sel("AS") is run_h013.sinyal_acak
          assert run_h010.buat_konfig is run_h009.buat_konfig
          assert "buat_konfig(" in inspect.getsource(run_h013.buat_konfig_sel)
          assert run_h013.LOOKBACK == list(LOOKBACK_H007)
          assert len(run_h013.kandidat()) == len(LOOKBACK_H007)
          assert run_h013.IMBALAN_BEKU in run_h010.JANGKAR
          assert {p["imbalan_R"] for p in run_h013.kandidat()} == {2.0}
          for p in run_h013.kandidat():
              assert run_h009.KUNCI_TERLARANG not in p
              assert "pakai_target" not in p and "maks_umur_bar" not in p
          print("1. mekanisme diimpor tanpa perubahan, imbalan BEKU: OK")

          # 2. Ambang pra-registrasi tidak bergerak, tidak dilonggarkan dan tidak
          #    pula diperketat.
          k = run_h013.hipotesis_h013("SS", engine.Konfig(maks_carry_R=0.25)).kriteria
          assert k.min_ekspektasi_R == 0.05
          assert k.min_trade_luar_sampel == 100
          assert k.maks_p_entri_acak == 0.05
          assert k.min_jendela_positif_rasio == 0.5
          assert run_h013.AMBANG_KONTRIBUSI_SINYAL == 0.020
          assert run_h013.MIN_ULANGAN == 300
          assert run_h013.MIN_TRADE_SEL == 100
          assert run_h013.H_BAR == 48
          print("2. ambang ADR-015 tidak bergerak: OK")

          # 3. Angka kembar, DAN cacat pemuat config yang dikunci.
          #
          #    Inilah pagar yang menjatuhkan run 30213913942. Ia tidak diturunkan
          #    melainkan diperkuat: config dan degenerasi wajib sepakat, pemuat
          #    wajib TETAP tidak membaca kedua pengaman, dan dasar_riset wajib
          #    memasangnya. Bila suatu hari pemuat itu diperbaiki, pagar ini gagal
          #    dan memaksa perbaikannya dijurnalkan alih-alih menyelinap ke dalam
          #    dua belas hipotesis yang memakainya.
          kunci = kunci_config(KONFIG)
          assert kunci["min_median_stop_frac"] == AMBANG_MIN_STOP_FRAC == 0.004
          assert kunci["maks_biaya_masuk_R"] == AMBANG_BIAYA_MASUK_R == 0.5
          mentah = muat_konfig_h002(KONFIG)
          assert mentah.maks_biaya_masuk_R == 0.0, mentah.maks_biaya_masuk_R
          assert mentah.stop_hormati_celah is False
          dasar = run_h013.dasar_riset(mentah)
          assert dasar.maks_biaya_masuk_R == AMBANG_BIAYA_MASUK_R
          assert dasar.stop_hormati_celah is True
          assert dasar.maks_carry_R > 0
          print("3. angka kembar, pengaman DIPASANG dasar_riset: OK")

          # 4. CACAT BUTA-INTERVAL KETUJUH (ADR-023). Inilah pagar yang mencegah
          #    run ini menghasilkan empat laporan rapi yang seluruhnya kosong.
          #    Fungsinya DIPANGGIL, aritmetikanya tidak disalin.
          j1 = run_h013.jendela_bar("1h")
          assert j1["panjang_latih"] == bawaan(runner.Opsi, "panjang_latih") == 4320
          assert j1["panjang_uji"] == bawaan(runner.Opsi, "panjang_uji") == 2160
          assert j1["embargo"] == bawaan(runner.Opsi, "embargo") == 168
          assert run_h013.PEMANASAN == bawaan(runner.Opsi, "pemanasan") == 200
          j4 = run_h013.jendela_bar("4h")
          assert j4 == {"panjang_latih": 1080, "panjang_uji": 540, "embargo": 42}, j4
          butuh = run_h013.bar_dibutuhkan("4h")
          assert butuh == 1862, butuh
          lantai_4h = kunci.get("min_bar_4h")
          if lantai_4h is not None:
              assert butuh < lantai_4h, (butuh, lantai_4h)
          assert butuh < run_h013.bar_dibutuhkan("1h") == 6848
          print(f"4. jendela 4h {j4}, satu jendela {butuh} bar (1h 6848): OK")

          # 5. ADR-020. Geometri keluar tidak dilombakan, dan kedua sel sungguh
          #    berbeda pada dua medan itu saja.
          assert bawaan(engine.Konfig, "pakai_target") is True
          medan = [f.name for f in dataclasses.fields(engine.Konfig)]
          assert medan[-1] == "pakai_target", medan[-3:]
          params = {"lookback": 20, "imbalan_R": run_h013.IMBALAN_BEKU}
          k_ss = run_h013.buat_konfig_sel("SS")(params, dasar)
          k_sh = run_h013.buat_konfig_sel("SH")(params, dasar)
          assert k_ss.pakai_target is True and k_ss.maks_umur_bar == 42
          assert k_sh.pakai_target is False and k_sh.maks_umur_bar == 48
          assert k_ss.maks_carry_realisasi_R == run_h009.AMBANG_CARRY_KERAS
          assert k_sh.maks_carry_realisasi_R == run_h009.AMBANG_CARRY_KERAS
          # Pengaman ikut terwarisi ke konfig per kandidat, bukan hilang di jalan.
          assert k_ss.maks_biaya_masuk_R == AMBANG_BIAYA_MASUK_R
          assert k_sh.stop_hormati_celah is True
          # 168 dari config adalah 28 hari pada 4h dan TIDAK boleh terpakai.
          assert k_ss.maks_umur_bar != dasar.maks_umur_bar
          print("5. pakai_target, batas umur, dan pengaman per sel: OK")

          # 6. Bawaan pengaman dan lantai tetap MATI, supaya H-001b sampai H-012
          #    tetap dapat diulang tanpa satu entri pun tertolak.
          assert bawaan(engine.Konfig, "maks_biaya_masuk_R") == 0.0
          assert bawaan(engine.Konfig, "stop_hormati_celah") is False
          assert bawaan(runner.Opsi, "min_median_stop_frac") == 0.0
          assert bawaan(engine.Hasil, "entri_ditolak_biaya") == 0
          print("6. bawaan pengaman dan lantai tetap MATI: OK")

          # 7. ADR-021. Satu riset, satu mekanisme pengacakan, satu seed - dibaca
          #    dari tanda tangan gerbang, bukan disalin sebagai angka.
          seed_gerbang = inspect.signature(
              gerbang.gerbang_entri_acak
          ).parameters["seed"].default
          assert run_h013.SEED_PERMUTASI == seed_gerbang == 42
          s = np.array([1] * 10 + [-1] * 5 + [0] * 85, dtype="int64")
          acak = run_h013.permutasi_sinyal(s)
          assert int((acak == 1).sum()) == 10 and int((acak == -1).sum()) == 5
          assert not np.array_equal(acak, s)
          print("7. permutasi memakai seed dan mekanisme gerbang: OK")

          # 8. Angka haram tidak boleh menyelinap masuk sebagai pembanding.
          #    +0,060163R adalah hasil membuang USDCUSDT sesudah melihat hasilnya.
          isi = inspect.getsource(run_h013)
          for haram in ("0.060163", "0.059546", "0.060168", "0.05302836"):
              assert haram not in isi, haram
          assert run_h013.SKOR_ACAK_TERDAHULU == 0.04661
          # Dataset WAJIB berbeda dari H-009: tripwire di sini dibalik.
          assert run_h013.DATASET != run_h009.DATASET
          assert "4h" in run_h013.DATASET and "1h" not in run_h013.DATASET
          sidik = {
              s_: run_h013.hipotesis_h013(s_, dasar).sidik()
              for s_ in run_h013.NAMA_SEL
          }
          assert len(set(sidik.values())) == 4
          print("8. angka haram tidak dipakai, sidik empat sel berbeda: OK")

          print("")
          print("pagar pra-terbang H-013: LULUS")
          print(f"lantai {AMBANG_MIN_STOP_FRAC}, pengaman {AMBANG_BIAYA_MASUK_R}R")
          print(f"empat sel {list(run_h013.NAMA_SEL)}, {len(run_h013.kandidat())} kandidat per sel")
          print(
              "KONSEKUENSI KONSTRUKSI (bukan temuan): lookahead dan entri_acak "
              "GAGAL pada sel AS dan AH"
          )
          for nama, isi_ramalan in run_h013.RAMALAN.items():
              print(f"  ramalan {nama}: {isi_ramalan}")
          PY

      - id: lantai
        name: Baca lantai semesta dari config
        run: |
          set -o pipefail
          {
            LANTAI=$(python -c "from lux.backtest.run_h012 import kunci_config; print(kunci_config('config/lux.yaml')['min_median_stop_frac'])")
            echo "lantai=${LANTAI}"
            echo "lantai=${LANTAI}" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee logs/lantai.log

      - id: unduh
        name: Unduh aset 4h dari rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            mkdir -p aset
            gh release download "$TAG" -D aset -p 'ohlcv_4h_*.parquet' --clobber
            gh release download "$TAG" -D aset -p 'funding_shard*.parquet' --clobber
            ls -1 aset | wc -l
            du -sh aset
            echo "--- berkas 4h ---"
            ls -la aset | grep '4h' || echo "(TIDAK ADA berkas 4h - run akan kosong)"
          } 2>&1 | tee logs/unduh.log

      - id: jalan
        name: Jalankan H-013 empat sel
        run: |
          set -o pipefail
          python -m lux.backtest.run_h013 \
            --dir aset \
            --interval 4h \
            --universe reports/universe_layak_v2_4h.json \
            --akhir-sejati reports/akhir_sejati_4h.json \
            --min-median-stop-frac "${{ steps.lantai.outputs.lantai }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --ulangan "${{ github.event.inputs.ulangan || '300' }}" \
            --out reports \
            2>&1 | tee logs/backtest.log

      - name: Salin log ke laporan
        if: always()
        run: |
          mkdir -p reports logs
          {
            echo "# Log backtest H-013"
            echo
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "## Berkas hasil"
            echo
            echo 'Laporan yang dikomit tanpa backtest_h013_kontribusi.json berarti run GAGAL.'
            echo
            echo '```'
            ls -l reports/backtest_h013_kontribusi.md \
                  reports/backtest_h013_kontribusi.json 2>&1 \
              || echo "(ringkasan kontribusi TIDAK ADA - run GAGAL sebelum selesai)"
            echo
            echo "--- laporan per sel ---"
            ls -l reports/backtest_h013_*.json 2>&1 \
              || echo "(tidak satu sel pun menulis laporan)"
            echo '```'
            for berkas in deps uji preflight lantai unduh backtest; do
              echo
              echo "## logs/${berkas}.log"
              echo
              echo '```'
              if [ -s "logs/${berkas}.log" ]; then
                tail -c 120000 "logs/${berkas}.log"
              else
                echo "(langkah ini tidak pernah berjalan atau tidak menulis apa pun)"
              fi
              echo '```'
            done
          } > reports/backtest_log.md

      - name: Komit hasil
        if: always()
        run: |
          git config user.name lux-backtest
          git config user.email actions@github.com
          git add reports hipotesis
          git diff --cached --quiet && echo "tidak ada perubahan" && exit 0
          git commit -m "chore(backtest): laporan run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
