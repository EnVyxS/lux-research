name: backtest

# Catatan urutan dorongan: workflow yang memicu dirinya sendiri harus didorong
# SESUDAH seluruh modul yang dipanggilnya ada di repo. Berkas ini pernah
# didorong lebih dulu, sehingga run pertamanya berjalan ketika
# lux/backtest/run_wf.py belum ada.
#
# KEGAGALAN YANG TIDAK TERBACA. Run 30177134015 mati 30 detik setelah berkas
# ini didorong, sebelum langkah jalan, dan satu-satunya yang tertulis ke repo
# adalah 'tidak ada log; kegagalan terjadi sebelum langkah jalan'. Agen tidak
# punya akses ke log Actions, sehingga penyebabnya hanya bisa ditebak, dan
# tebakan tentang penyebab kegagalan hampir selalu meleset. Run 30177253467
# lolos di atas kode yang sama persis, jadi kegagalan itu bersifat sesaat dan
# tetap dicatat sebagai tidak diketahui, bukan ditebak.
#
# Cacatnya ada pada rancangan berkas ini, bukan pada kegagalannya: doktrin
# 'tulis hasil ke reports/' hanya diterapkan pada langkah jalan, sedangkan
# gerbang pra-terbang yang mendahuluinya dibiarkan bisu. Sejak sekarang setiap
# langkah pra-terbang punya id, keluarannya disalurkan ke logs/preflight.log,
# dan hasil tiap langkah dicetak ke laporan apa pun yang terjadi.
#
# --komit sengaja TIDAK diteruskan. Pendaftaran hipotesis bersifat sekali-tulis
# dan menolak isi yang berbeda; memasukkan sha commit ke dalamnya akan membuat
# setiap run berikutnya mati karena isinya tidak lagi sama dengan yang
# terdaftar. Sha run tetap terekam di riwayat Actions.
#
# Pola unduh WAJIB sama persis dengan validate.yml, yaitu 'ohlcv_1h_*.parquet'.
# Pola itu ikut menarik shard ekor hasil backfill harian. Sempat dipersempit
# menjadi 'ohlcv_1h_shard*' di sini, yang akan membuat backtest berjalan di atas
# kumpulan data yang bukan kumpulan data yang divalidasi. Aset '_retry' tetap
# tersaring di dalam kode, bukan lewat pola unduh.
#
# Manifes sekali-tulis yang terbentuk pada run berpola sempit itu sudah dihapus
# dari repo. Gerbang checksum-lah yang menemukannya, dengan melaporkan empat
# aset asing. Bila gerbang itu kembali berbunyi, yang pertama harus dicurigai
# adalah perbedaan kumpulan berkas, bukan kerusakan aset.
#
# ADR-003: universe universe_layak_v2.json (438 simbol, ekor datar dipangkas).
# --akhir-sejati meneruskan akhir_sejati.json sehingga gerbang survivorship
# memakai tanggal kematian sejati, bukan stempel bar terakhir mentah.
#
# Riwayat hipotesis yang dijalankan berkas ini:
#   H-001b  run 30172926477  DITOLAK, invarian_risiko gagal (-2,5853R)
#   H-002   run 30174642490  DITOLAK, sembilan gerbang lulus, +0,03159R
#   H-003   run 30175179866  DITOLAK telak, -0,24782R, p entri acak 1,0
#   H-004   run 30175665060  DITOLAK, -0,01818R, sembilan gerbang lulus
#   H-005   run 30175665060  DITOLAK, -0,03571R, p 0,0396 > 0,0167 (Bonferroni)
#   H-006   run 30175665060  DITOLAK, -0,13449R, p entri acak 1,0
#   H-007   run 30176317156  DITOLAK, +0,04044R terbaik, invarian_risiko -1,9769
#   H-008   run 30177134015  GAGAL sebelum langkah jalan, penyebab tidak terbaca
#   H-008   run 30177253467  DITOLAK, +0,04126R, invarian_risiko -1,9769
#   H-009   sekarang         pengaman carry DIPATOK (ADR-009)
#
# Tidak satu pun dari hipotesis yang sudah divonis dijalankan ulang, dan tidak
# satu ambang pun diturunkan. Yang boleh dilakukan hanya mendaftarkan hipotesis
# baru dengan ID baru.
#
# ADR-009. H-008 memasang pengaman carry terealisasi lalu menyerahkan ambangnya
# kepada walk-forward. Hasilnya, dari 356 jendela:
#
#   ambang 0,00 (mati)  dipilih 334 jendela
#   ambang 0,25         dipilih  22 jendela
#   ambang 0,50         dipilih   0 jendela
#
# Gerbang invarian_risiko jatuh di angka yang sama persis dengan H-007, yaitu
# -1,9769R. Pembongkaran sepuluh perdagangan terburuk di dalam laporan H-008
# menjelaskan sebabnya. Perdagangan terburuk, AIOTUSDT:
#
#   R -1,9769 = kotor -1,0182 - transaksi 0,0359 - FUNDING 0,9228
#
# Funding menyumbang 46,7 persen kerugian itu, dan ia komponen biaya terbesar
# di kesepuluh perdagangan terburuk. Stop bekerja sempurna di kesepuluhnya:
# alasan keluar 'stop' dengan kotor tepat 1R ditambah slippage. Tidak ada harga
# yang menganga melewati stop, dan lebar stop terburuk 2,83 persen justru lebih
# lebar dari rerata 3,61 persen.
#
# Perdagangan itu terbukti berjalan dengan pengaman MATI, dan ini deduksi bukan
# tebakan: carry 0,9228R melewati ambang teraktif mana pun di grid, jadi kalau
# pengaman menyala ia pasti memicu lebih dulu; ia keluar 'stop', bukan 'carry'.
#
# Sebabnya struktural. Walk-forward memilih dengan memaksimalkan ekspektasi
# dalam sampel, sementara invarian_risiko dinilai SESUDAH pemilihan selesai dan
# tidak pernah masuk fungsi tujuan. Pengaman risiko memotong posisi sebelum
# sempat pulih, jadi ia memakan ekspektasi, jadi pemaksimal ekspektasi akan
# selalu mematikannya bila diberi pilihan. Karena itu H-008 bukan uji terhadap
# pengaman carry melainkan uji terhadap kesediaan pemaksimal keuntungan
# membatasi kerugiannya sendiri. Jawabannya tidak.
#
# Kesimpulannya satu kalimat: BATAS RISIKO TIDAK DILOMBAKAN.
#
# H-009 karena itu tidak mengubah mekanismenya sama sekali, hanya siapa yang
# memutuskan. Ruang parameter kembali PERSIS ke grid H-007:
#
#   lookback {20,55,100} x imbalan {1,2,3,4} = 12 kombinasi
#
# dan maks_carry_realisasi_R dipatok konstan 0,25 di luar grid. Nilai itu sudah
# tertulis di config/lux.yaml v2 sebagai risiko.maks_carry_R sejak ADR-004,
# ditetapkan sebelum H-002 dijalankan. Ia bukan pemenang pasca-hoc; di H-008 ia
# justru kalah 22 lawan 334.
#
# Grid imbalan tetap TIDAK dipersempit meski 4R menang di 194 dari 356 jendela
# H-007. Mempersempit ruang pencarian setelah melihat hasil adalah penyetelan
# pasca-hoc, dan itu tepat kesalahan yang sedang dihindari di sini.
#
# Ramalan ditulis sebelum run, termasuk yang merugikan hipotesis ini sendiri:
#   1. keluar 'carry' melonjak dari 2 ke ratusan
#   2. kerugian terburuk turun di bawah 1,5R sehingga invarian_risiko lulus
#   3. ekspektasi TURUN di bawah 0,04126R milik H-008
# Ramalan ketiga berarti H-009 kemungkinan besar tetap ditolak, kali ini oleh
# kriteria 0,05R. Bila ekspektasi justru naik, yang patut dicurigai bukan
# keberhasilan melainkan pengamannya tidak benar-benar memicu.
#
# Kriteria tidak dilonggarkan sedikit pun dari H-002, H-007, dan H-008.
# Melonggarkannya sekarang, setelah tahu pengaman ini memakan ekspektasi,
# adalah bentuk kecurangan yang paling mudah dibela.
#
# Percobaan tunggal, jadi ambang p entri acak tetap 0,05 tanpa koreksi
# multiplisitas. ADR-006 melarang sinyal harga ketujuh; larangan itu dihormati
# dengan tidak menulis satu baris pun di lux/strategi/. Sinyalnya sama persis
# dengan H-002, H-007, dan H-008.
#
# Bawaan pengaman di engine tetap MATI (0,0), sehingga H-001b sampai H-007 tetap
# dapat diulang bita demi bita. Itu dikunci pengujian, bukan diandaikan.
#
# limit tetap 40 simbol pertama secara alfabet. Mengubahnya membuat seluruh
# hasil tidak dapat dibandingkan dengan H-001b sampai H-008.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah simbol yang diuji (0 = semua)"
        default: "40"
      ulangan:
        description: "Ulangan uji permutasi entri acak"
        default: "100"
  push:
    paths:
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        id: deps
        run: |
          set -o pipefail
          mkdir -p logs
          echo "=== pasang dependensi ===" >> logs/preflight.log
          python -V 2>&1 | tee -a logs/preflight.log
          pip install -r requirements.txt pytest 2>&1 | tee -a logs/preflight.log
          pip list 2>&1 | tee -a logs/preflight.log

      # Gerbang pra-terbang. Sudah berkali-kali mencegah pekerjaan panjang yang
      # sia-sia karena cacat yang tertangkap dalam hitungan detik.
      - name: Uji dulu, baru unduh
        id: uji
        if: always() && steps.deps.outcome == 'success'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p logs
          echo "=== pytest ===" >> logs/preflight.log
          python -m pytest tests -q 2>&1 | tee -a logs/preflight.log

      # Impor dan pembacaan config diuji sebelum satu bita pun diunduh.
      # pyyaml pernah hanya terpasang di sebagian workflow dan menjatuhkan run
      # ini tepat setelah unduhan selesai.
      #
      # Dua pemeriksaan terakhir adalah inti ADR-009 dan sengaja diletakkan di
      # sini, bukan di ujung run: bila sumbu pengaman bocor kembali ke ruang
      # pencarian, atau bila ambangnya mati, run harus berhenti dalam hitungan
      # detik dan bukan setelah 559M aset diunduh.
      - name: Periksa impor modul jalan
        id: impor
        if: always() && steps.uji.outcome == 'success'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p logs
          echo "=== impor ===" >> logs/preflight.log
          {
            python -c "import yaml, pandas, pyarrow; print('impor pihak ketiga siap')"
            python -c "import lux.backtest.run_wf as m; print('run_wf siap', m.POLA_DILARANG)"
            python -c "import lux.backtest.runner as r; print('runner bersama siap')"
            python -c "from lux.backtest.engine import Konfig; print('bawaan pengaman mati:', Konfig().maks_carry_realisasi_R == 0.0)"
            python -c "from lux.analisis.titik_impas import ALASAN_TIDAK_SELESAI; print('alasan tidak selesai:', ALASAN_TIDAK_SELESAI)"
            python -c "from lux.backtest.run_h009 import AMBANG_CARRY_KERAS, IMBALAN, LOOKBACK, kandidat, spek_h009; from lux.backtest.run_h002 import muat_konfig_h002; k = muat_konfig_h002('config/lux.yaml'); s = spek_h009(k); print('H-009 siap:', s.h.id, s.nama, s.h.jumlah_kombinasi, 'kombinasi, sidik', s.h.sidik()[:12]); print('  lookback', LOOKBACK, 'imbalan', IMBALAN, 'kandidat', len(kandidat())); print('  ambang carry DIPATOK:', AMBANG_CARRY_KERAS); print('  saringan ADR-004 tetap:', k.maks_umur_bar, k.maks_carry_R, k.jendela_carry_hari)"
            python -c "from lux.backtest.run_h007 import IMBALAN as I7, LOOKBACK as L7; from lux.backtest.run_h009 import IMBALAN as I9, LOOKBACK as L9; assert I9 == I7 and L9 == L7, 'grid H-009 menyimpang dari H-007'; print('grid identik dengan H-007: ya')"
            python -c "from lux.backtest.run_h009 import AMBANG_CARRY_KERAS, KUNCI_TERLARANG, buat_konfig, kandidat; from lux.backtest.engine import Konfig; from lux.backtest.run_h002 import muat_konfig_h002; k = muat_konfig_h002('config/lux.yaml'); assert all(KUNCI_TERLARANG not in p for p in kandidat()), 'batas risiko bocor ke ruang pencarian'; assert AMBANG_CARRY_KERAS > 0, 'pengaman mati'; assert all(buat_konfig(p, k).maks_carry_realisasi_R == AMBANG_CARRY_KERAS for p in kandidat()), 'ada kandidat tanpa pengaman'; print('ADR-009 ditegakkan: pengaman menyala di', len(kandidat()), 'dari', len(kandidat()), 'kandidat')"
          } 2>&1 | tee -a logs/preflight.log

      - name: Unduh aset
        id: unduh
        if: always() && steps.impor.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p aset logs
          echo "=== unduh ===" >> logs/preflight.log
          gh release download "$TAG" -p 'ohlcv_1h_*.parquet' -D aset --clobber
          gh release download "$TAG" -p 'funding_shard*.parquet' -D aset --clobber
          ls -la aset | tail -20 2>&1 | tee -a logs/preflight.log
          du -sh aset 2>&1 | tee -a logs/preflight.log

      - name: Jalankan H-009 (pengaman carry dipatok)
        id: jalan
        if: always() && steps.unduh.outcome == 'success'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p logs
          python -m lux.backtest.run_h009 \
            --dir aset \
            --interval 1h \
            --universe reports/universe_layak_v2.json \
            --akhir-sejati reports/akhir_sejati.json \
            --limit "${{ github.event.inputs.limit || 40 }}" \
            --ulangan "${{ github.event.inputs.ulangan || 100 }}" \
            --out reports 2>&1 | tee logs/backtest.log

      # Laporan ini WAJIB tetap terbentuk pada kegagalan apa pun, termasuk
      # kegagalan yang terjadi sebelum satu bita data pun diunduh. Tanpa itu,
      # satu-satunya cara mengetahui penyebabnya adalah menebak.
      - name: Salin log ke laporan
        if: always()
        run: |
          mkdir -p reports logs
          {
            echo "# Log run backtest H-009 (ADR-009)"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo
            echo "| Langkah | Hasil |"
            echo "|---|---|"
            echo "| pasang dependensi | \`${{ steps.deps.outcome }}\` |"
            echo "| pytest | \`${{ steps.uji.outcome }}\` |"
            echo "| impor | \`${{ steps.impor.outcome }}\` |"
            echo "| unduh aset | \`${{ steps.unduh.outcome }}\` |"
            echo "| jalan | \`${{ steps.jalan.outcome }}\` |"
            echo
            echo "## Pra-terbang"
            echo
            echo '```'
            tail -c 20000 logs/preflight.log 2>/dev/null || echo "(logs/preflight.log tidak terbentuk sama sekali)"
            echo '```'
            echo
            echo "## Langkah jalan"
            echo
            echo '```'
            tail -c 60000 logs/backtest.log 2>/dev/null || echo "(tidak ada log; kegagalan terjadi sebelum langkah jalan)"
            echo '```'
          } > reports/backtest_log.md

      - name: Commit laporan kembali ke repo
        if: always()
        run: |
          git config user.name "lux-backtest"
          git config user.email "actions@github.com"
          git add reports || true
          git add hipotesis || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(backtest): laporan run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
