# Menjalankan H-012 (ADR-014 bagian 8) di GitHub Actions dan MENGOMIT hasilnya
# balik ke reports/, karena log workflow tidak dapat dibaca dari sandbox dan
# tidak ada satu pun fungsi Actions yang tersedia. Berkas laporan yang dikomit
# adalah satu-satunya kanal keluaran yang dapat diaudit.
#
# Dipicu lewat filter paths pada berkasnya sendiri. Akibatnya push berkas ini
# LANGSUNG memulai run, jadi ia selalu dibalik paling akhir, sesudah seluruh
# modul hijau.
#
# H-012 BUKAN "H-010 setelah perbaikan". H-010 tidak direhabilitasi: pada 300
# permutasi mekanismenya memberi p 0,0631, yakni gagal. Yang diuji di sini
# adalah pertanyaan baru pada dimensi waktu, di atas semesta yang definisinya
# diperbaiki lebih dulu oleh lantai median stop_frac 0,004.
#
# --komit sengaja TIDAK diteruskan ke orkestrator: yang mengomit adalah langkah
# di bawah, sekali, sesudah seluruh berkas hasil ada. Laporan yang dikomit tanpa
# berkas hasil berarti run GAGAL, bukan run yang laporannya kosong.

name: backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah simbol; 0 berarti seluruh semesta layak"
        default: "0"
      ulangan:
        description: "Ulangan permutasi entri acak; H-012 menolak di bawah 300"
        default: "300"
  push:
    paths:
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: deps
        name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import numpy, pandas, pyarrow, yaml; print(numpy.__version__)"

      - id: uji
        name: Pytest wajib hijau sebelum apa pun diunduh
        run: python -m pytest tests -q

      - id: impor
        name: Pagar pra-terbang H-012
        run: |
          python - <<'PY'
          import inspect

          from lux.analisis import periode
          from lux.backtest import engine, run_h009, run_h010, run_h012, runner
          from lux.backtest.run_h002 import muat_konfig_h002
          from lux.degenerasi import AMBANG_BIAYA_MASUK_R, AMBANG_MIN_STOP_FRAC

          # 1. Mekanisme WAJIB identik dengan H-010/H-009. Bila grid ikut
          #    bergeser, perubahan hasil tidak dapat dipisahkan dari perubahan
          #    semesta dan periode, dan H-012 tidak menjawab apa pun.
          assert run_h012.kandidat_h010 is run_h010.kandidat
          assert run_h012.buat_konfig_h010 is run_h010.buat_konfig
          assert run_h010.buat_konfig is run_h009.buat_konfig
          assert list(run_h012.LOOKBACK_H010) == [20, 55, 100]
          assert list(run_h012.IMBALAN_H010) == [2.0, 4.0, 6.0, 8.0]
          assert len(run_h012.kandidat_h010()) == 12
          for p in run_h012.kandidat_h010():
              assert run_h009.KUNCI_TERLARANG not in p
              assert "maks_biaya_masuk_R" not in p

          # 2. Ambang pra-registrasi tidak bergerak, tidak dilonggarkan dan
          #    tidak pula diperketat.
          k = run_h012.hipotesis_h012(engine.Konfig()).kriteria
          assert k.min_ekspektasi_R == 0.05
          assert k.min_trade_luar_sampel == 100
          assert k.maks_p_entri_acak == 0.05
          assert k.min_jendela_positif_rasio == 0.5
          assert run_h012.BATAS_VOID == 20
          assert run_h012.PERIODE_TAHAN_TANGGAL == "2026-01-01"
          assert run_h012.PERIODE_TAHAN_MS == 1767225600000
          assert run_h012.PERIODE_TAHAN_BULAN == "2026-01"

          # 3. Angka kembar. Lantai dan pengaman hidup di config/lux.yaml dan di
          #    lux/degenerasi.py; bila keduanya berselisih, satu di antaranya
          #    digeser tanpa dijurnalkan.
          kunci = run_h012.kunci_config("config/lux.yaml")
          assert kunci["min_median_stop_frac"] == AMBANG_MIN_STOP_FRAC == 0.004
          assert kunci["maks_biaya_masuk_R"] == AMBANG_BIAYA_MASUK_R == 0.5

          # 4. Aritmetika yang melahirkan keduanya DIHITUNG, bukan dipercaya
          #    sebagai label: biaya bolak-balik dibagi lantai harus tepat 0,5R.
          dasar = muat_konfig_h002("config/lux.yaml")
          bolak_balik = 2.0 * (dasar.fee_efektif + dasar.slippage)
          assert abs(bolak_balik - 0.002) < 1e-12, bolak_balik
          assert abs(bolak_balik / AMBANG_MIN_STOP_FRAC - AMBANG_BIAYA_MASUK_R) < 1e-12

          # 5. Bawaan mesin dan runner tetap MATI, supaya H-001b sampai H-011
          #    tetap dapat diulang tanpa satu entri pun tertolak dan tanpa satu
          #    simbol pun tersaring.
          assert engine.Konfig().maks_biaya_masuk_R == 0.0
          assert runner.Opsi(dir_aset="aset").min_median_stop_frac == 0.0
          assert engine.Hasil(symbol="X", perdagangan=[]).entri_ditolak_biaya == 0

          # 6. Sambungannya benar-benar ada. Modul yang hijau sendiri tetapi
          #    tidak tersambung menghasilkan laporan yang diam-diam kosong, dan
          #    itu sudah pernah terjadi.
          src_muat = inspect.getsource(runner.muat_konteks)
          assert "saring_bingkai" in src_muat
          assert "min_median_stop_frac" in src_muat
          src_spek = inspect.getsource(runner.jalankan_spek)
          for kunci_laporan in (
              "entri_ditolak_biaya",
              "entri_ditolak_biaya_per_simbol",
              "lantai_semesta",
              "agregat_periode",
              "maks_biaya_masuk_R",
              "min_median_stop_frac",
          ):
              assert kunci_laporan in src_spek, kunci_laporan

          # 7. Agregat periode memakai waktu MASUK dan batasnya milik periode
          #    tahan. Diperiksa pada data buatan, bukan diandaikan.
          ms = periode.ms_dari_tanggal("2026-01-01")
          uji = periode.agregat_per_bulan([(ms - 1, 1.0), (ms, -2.0)])
          assert [b["periode"] for b in uji] == ["2025-12", "2026-01"]
          assert run_h012.agregat_tahan(uji)["trade"] == 1
          assert run_h012.agregat_sebelum(uji)["trade"] == 1

          # 8. Angka haram tidak boleh menyelinap masuk sebagai pembanding.
          #    +0,060163R adalah hasil membuang USDCUSDT sesudah melihat
          #    hasilnya, yaitu tepat perbuatan yang dilarang ADR-013 bagian 8.
          isi = inspect.getsource(run_h012)
          for haram in ("0.060163", "0.059546", "0.060168"):
              assert haram not in isi, haram
          assert run_h012.SEBELUMNYA["h010_p_entri_acak_300_ulangan"] == 0.0631

          print("pagar pra-terbang H-012: LULUS")
          print(f"lantai {AMBANG_MIN_STOP_FRAC}, pengaman {AMBANG_BIAYA_MASUK_R}R")
          print(f"periode tahan sejak {run_h012.PERIODE_TAHAN_TANGGAL} UTC")
          for nama, isi_ramalan in run_h012.RAMALAN.items():
              print(f"  ramalan {nama}: {isi_ramalan}")
          PY

      - id: unduh
        name: Unduh aset dari rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p aset
          gh release download "$TAG" -D aset -p 'ohlcv_1h_*.parquet' --clobber
          gh release download "$TAG" -D aset -p 'funding_shard*.parquet' --clobber
          ls -1 aset | wc -l
          du -sh aset

      - id: jalan
        name: Jalankan H-012
        run: |
          mkdir -p logs reports
          python -m lux.backtest.run_h012 \
            --dir aset \
            --interval 1h \
            --universe reports/universe_layak_v2.json \
            --akhir-sejati reports/akhir_sejati.json \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --ulangan "${{ github.event.inputs.ulangan || '300' }}" \
            --out reports \
            2>&1 | tee logs/backtest.log

      - name: Salin log ke laporan
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# Log backtest H-012"
            echo
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```'
            tail -c 200000 logs/backtest.log 2>/dev/null || echo "(tidak ada log)"
            echo '```'
          } > reports/backtest_log.md

      - name: Komit hasil
        if: always()
        run: |
          git config user.name lux-backtest
          git config user.email actions@github.com
          git add reports
          git diff --cached --quiet && echo "tidak ada perubahan" && exit 0
          git commit -m "chore(backtest): laporan run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
