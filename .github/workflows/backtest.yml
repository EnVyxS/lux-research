name: backtest

# Catatan urutan dorongan: workflow yang memicu dirinya sendiri harus didorong
# SESUDAH seluruh modul yang dipanggilnya ada di repo dan hijau. Berkas ini
# pernah didorong lebih dulu, sehingga run pertamanya berjalan ketika
# lux/backtest/run_wf.py belum ada. Untuk H-010 urutannya dihormati:
# lux/backtest/run_h010.py dan tests/test_run_h010.py didorong di 3fa9f58c dan
# laporan 53c6684c mencatat 510 pengujian lulus sebelum berkas ini disentuh.
#
# KEGAGALAN YANG TIDAK TERBACA. Run 30177134015 mati 30 detik setelah berkas
# ini didorong, sebelum langkah jalan, dan satu-satunya yang tertulis ke repo
# adalah 'tidak ada log; kegagalan terjadi sebelum langkah jalan'. Agen tidak
# punya akses ke log Actions, sehingga penyebabnya hanya bisa ditebak, dan
# tebakan tentang penyebab kegagalan hampir selalu meleset. Run 30177253467
# lolos di atas kode yang sama persis, jadi kegagalan itu bersifat sesaat dan
# tetap dicatat sebagai tidak diketahui, bukan ditebak.
#
# Cacatnya ada pada rancangan berkas ini, bukan pada kegagalannya: doktrin
# 'tulis hasil ke reports/' hanya diterapkan pada langkah jalan, sedangkan
# gerbang pra-terbang yang mendahuluinya dibiarkan bisu. Sejak itu setiap
# langkah pra-terbang punya id, keluarannya disalurkan ke logs/preflight.log,
# dan hasil tiap langkah dicetak ke laporan apa pun yang terjadi.
#
# --komit sengaja TIDAK diteruskan. Pendaftaran hipotesis bersifat sekali-tulis
# dan menolak isi yang berbeda; memasukkan sha commit ke dalamnya akan membuat
# setiap run berikutnya mati karena isinya tidak lagi sama dengan yang
# terdaftar. Sha run tetap terekam di riwayat Actions.
#
# Pola unduh WAJIB sama persis dengan validate.yml, yaitu 'ohlcv_1h_*.parquet'.
# Pola itu ikut menarik shard ekor hasil backfill harian. Sempat dipersempit
# menjadi 'ohlcv_1h_shard*' di sini, yang akan membuat backtest berjalan di atas
# kumpulan data yang bukan kumpulan data yang divalidasi. Aset '_retry' tetap
# tersaring di dalam kode, bukan lewat pola unduh.
#
# Manifes sekali-tulis yang terbentuk pada run berpola sempit itu sudah dihapus
# dari repo. Gerbang checksum-lah yang menemukannya, dengan melaporkan empat
# aset asing. Bila gerbang itu kembali berbunyi, yang pertama harus dicurigai
# adalah perbedaan kumpulan berkas, bukan kerusakan aset.
#
# ADR-003: universe universe_layak_v2.json (438 simbol, ekor datar dipangkas).
# --akhir-sejati meneruskan akhir_sejati.json sehingga gerbang survivorship
# memakai tanggal kematian sejati, bukan stempel bar terakhir mentah.
#
# Riwayat hipotesis yang dijalankan berkas ini:
#   H-001b  run 30172926477  DITOLAK, invarian_risiko gagal (-2,5853R)
#   H-002   run 30174642490  DITOLAK, sembilan gerbang lulus, +0,03159R
#   H-003   run 30175179866  DITOLAK telak, -0,24782R, p entri acak 1,0
#   H-004   run 30175665060  DITOLAK, -0,01818R, sembilan gerbang lulus
#   H-005   run 30175665060  DITOLAK, -0,03571R, p 0,0396 > 0,0167 (Bonferroni)
#   H-006   run 30175665060  DITOLAK, -0,13449R, p entri acak 1,0
#   H-007   run 30176317156  DITOLAK, +0,04044R terbaik, invarian_risiko -1,9769
#   H-008   run 30177134015  GAGAL sebelum langkah jalan, penyebab tidak terbaca
#   H-008   run 30177253467  DITOLAK, +0,04126R, invarian_risiko -1,9769
#   H-009   run 30186730437  DITOLAK, +0,041359R, SEMBILAN GERBANG LULUS,
#                            jatuh hanya pada ambang 0,05R (kurang 0,008641R)
#   H-010   sekarang         dinding grid imbalan digeser (ADR-012)
#
# Tidak satu pun dari hipotesis yang sudah divonis dijalankan ulang, dan tidak
# satu ambang pun diturunkan. Yang boleh dilakukan hanya mendaftarkan hipotesis
# baru dengan ID baru.
#
# GERBANG SEKARANG SEBELAS, bukan sembilan. Dua tambahan sejak H-009:
#   konsentrasi   (ADR-010, disambung 8cf70f08) jackknife dan penyebut bruto
#   funding_ekor  (ADR-011, disambung 114b0d7e) porsi funding pada sepuluh
#                 perdagangan terburuk, bukan rerata dan bukan total
# Keduanya ambangnya ditulis setelah sebagian data terlihat, sehingga keduanya
# MENGIKAT MULAI H-010 dan tidak diterapkan ke belakang. H-010 karena itu
# hipotesis pertama yang dinilai sebelas gerbang penuh.
#
# Mengapa funding_ekor ada. Gerbang funding lama menilai total funding mutlak
# dan memberi 10.253,97 untuk H-008 lawan 10.199,59 untuk H-009, selisih
# setengah persen, padahal di antara kedua run itu porsi funding pada
# perdagangan terburuk jatuh dari 46,7 persen ke 16,5 persen dan gerbang
# invarian_risiko berbalik dari gagal menjadi lulus. Gerbang yang memberi
# jawaban sama pada dua keadaan bertolak belakang tidak memuat informasi.
#
# ADR-012, yang dijalankan run ini. Pada H-007, H-008, dan H-009 pemilih
# walk-forward menempel di batas atas grid imbalan. Di H-009, dari 356 jendela:
#
#   imbalan 4,0 (batas atas)  dipilih 194 jendela  54,5 persen
#   imbalan 3,0               dipilih 101 jendela  28,4 persen
#   imbalan 2,0               dipilih  38 jendela  10,7 persen
#   imbalan 1,0               dipilih  23 jendela   6,5 persen
#
# Selama tiga hipotesis pola itu dibaca sebagai bukti bahwa menurunkan titik
# impas bekerja. Itu benar, tetapi ada tafsiran kedua yang tidak pernah
# diperiksa: optimumnya mungkin di LUAR grid, dan yang terukur hanya dinding
# grid. Selama dindingnya tidak digeser, kedua tafsiran tidak dapat dipisahkan.
# Itu cacat rancangan H-007, bukan hipotesis baru.
#
# Maka H-010 mengubah TEPAT SATU hal: imbalan {1,2,3,4} menjadi {2,4,6,8}.
#
#   lookback {20,55,100} x imbalan {2,4,6,8} = 12 kombinasi, identik dengan
#   H-009, sehingga multiplisitasnya sebanding dan ambang p tetap 0,05.
#
# Jangkar 2,0 dan 4,0 dipertahankan supaya hasilnya sebanding dengan H-009.
# Nilai 1,0 dan 3,0 dibuang, bukan ditambahkan, karena menambah berarti 18
# kombinasi dan multiplisitas yang berbeda. Satuan R tidak berubah karena jarak
# stop tetap ATR x 2,0.
#
# Ini BUKAN penyempitan grid pasca-hoc. Grid tidak dipersempit ke arah nilai
# yang sudah menang; dindingnya digeser KE LUAR, ke wilayah yang belum pernah
# diukur, dan penjaga di langkah impor menolak run bila arah pergeserannya
# terbalik atau bila jumlah kombinasinya berubah.
#
# run_h007.py HARAM disentuh. run_h009.py mengimpor grid dari run_h007 dan
# menolak berjalan bila keduanya berbeda; mengubah grid H-007 akan membatalkan
# penjaga itu dan mengubah arti laporan yang sudah dikomit. run_h010.py karena
# itu mendefinisikan gridnya sendiri, tetapi mengimpor buat_konfig, DATASET,
# KUNCI_TERLARANG, dan AMBANG_CARRY_KERAS dari run_h009 apa adanya, sehingga
# pematokan pengaman carry dijalankan kode yang sama persis.
#
# ADR-009 tetap berlaku penuh: BATAS RISIKO TIDAK DILOMBAKAN.
# maks_carry_realisasi_R tetap dipatok 0,25 di luar grid. Di H-008 ambang itu
# kalah 22 lawan 334 ketika dilombakan, dan alasannya bukan biaya melainkan
# kelangkaan: pengaman hanya menyala 16 kali dari 14.925 perdagangan (0,107
# persen), jadi jendela latih tipikal memuat nol atau satu peristiwa dan
# pemilih hanya melihat pemenang yang terpotong.
#
# BAHAYA YANG SUDAH DIKETAHUI SEBELUM RUN. Target lebih jauh berarti pegangan
# lebih lama, jadi:
#   1. Perdagangan tak selesai membengkak. maks_umur_bar tetap 168. H-009
#      mencatat umur 368 dan akhir_data 188, yaitu 3,7 persen. Pada 8R porsi
#      itu HARUS naik. Porsinya dicetak SEBELUM ekspektasi, karena bila ia
#      besar maka yang terukur adalah batas umur, bukan struktur keluar.
#   2. Carry membesar, dan di situlah gerbang kesebelas mengikat.
#   3. Pengaman carry lebih sering menyala. Itu fitur, bukan bug.
#
# DILARANG bila hasilnya buruk: melonggarkan maks_umur_bar, mematikan pengaman
# carry, atau melonggarkan ambang ADR-011 agar H-010 lulus. Ketiganya mengubah
# percobaan ini menjadi pencarian konfigurasi yang lulus.
#
# Ramalan ditulis sebelum run di ADR-012 bagian 5, termasuk yang merugikan
# hipotesis ini sendiri:
#   1. imbalan 8,0 dipilih 30-55 persen jendela; di atas 54,5 persen berarti
#      penempelan bersifat MEKANIS, di bawah 25 persen berarti dinding H-007
#      memang bukan dinding
#   2. laju kena target turun ke 0,13-0,20 dari 0,27544
#   3. porsi tak selesai naik dari 3,7 persen ke lebih dari 12 persen
#   4. porsi_funding_ekor_maks naik ke 0,20-0,35; di atas 0,35 gerbang
#      kesebelas GAGAL dan itu temuan, bukan alasan melonggarkan ambang
#   5. ekspektasi 0,030-0,048, jadi TIDAK mencapai 0,05 dan H-010 kemungkinan
#      besar menjadi penolakan kesepuluh
#
# Kriteria tidak dilonggarkan sedikit pun dari H-002 sampai H-009. Setelah tahu
# H-009 hanya kurang 0,008641R, melonggarkannya sekarang adalah bentuk
# kecurangan yang paling mudah dibela dan paling merusak.
#
# Percobaan tunggal, jadi ambang p entri acak tetap 0,05 tanpa koreksi
# multiplisitas. ADR-006 melarang sinyal harga ketujuh; larangan itu dihormati
# dengan tidak menulis satu baris pun di lux/strategi/. Sinyalnya sama persis
# dengan H-002, H-007, H-008, dan H-009.
#
# Bawaan pengaman di engine tetap MATI (0,0), sehingga H-001b sampai H-007 tetap
# dapat diulang bita demi bita. Itu dikunci pengujian, bukan diandaikan.
#
# limit tetap 40 simbol pertama secara alfabet. Mengubahnya membuat seluruh
# hasil tidak dapat dibandingkan dengan H-001b sampai H-009.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah simbol yang diuji (0 = semua)"
        default: "40"
      ulangan:
        description: "Ulangan uji permutasi entri acak"
        default: "100"
  push:
    paths:
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        id: deps
        run: |
          set -o pipefail
          mkdir -p logs
          echo "=== pasang dependensi ===" >> logs/preflight.log
          python -V 2>&1 | tee -a logs/preflight.log
          pip install -r requirements.txt pytest 2>&1 | tee -a logs/preflight.log
          pip list 2>&1 | tee -a logs/preflight.log

      # Gerbang pra-terbang. Sudah berkali-kali mencegah pekerjaan panjang yang
      # sia-sia karena cacat yang tertangkap dalam hitungan detik.
      - name: Uji dulu, baru unduh
        id: uji
        if: always() && steps.deps.outcome == 'success'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p logs
          echo "=== pytest ===" >> logs/preflight.log
          python -m pytest tests -q 2>&1 | tee -a logs/preflight.log

      # Impor dan pembacaan config diuji sebelum satu bita pun diunduh.
      # pyyaml pernah hanya terpasang di sebagian workflow dan menjatuhkan run
      # ini tepat setelah unduhan selesai.
      #
      # Pemeriksaan ADR-009 dan ADR-012 sengaja diletakkan di sini, bukan di
      # ujung run: bila sumbu pengaman bocor kembali ke ruang pencarian, bila
      # ambangnya mati, bila grid H-009 menyimpang dari H-007, atau bila dinding
      # imbalan digeser ke arah yang salah, run harus berhenti dalam hitungan
      # detik dan bukan setelah 559M aset diunduh.
      - name: Periksa impor modul jalan
        id: impor
        if: always() && steps.uji.outcome == 'success'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p logs
          echo "=== impor ===" >> logs/preflight.log
          {
            python -c "import yaml, pandas, pyarrow; print('impor pihak ketiga siap')"
            python -c "import lux.backtest.run_wf as m; print('run_wf siap', m.POLA_DILARANG)"
            python -c "import lux.backtest.runner as r; print('runner bersama siap')"
            python -c "from lux.backtest.gerbang import NAMA_GERBANG; print('jumlah gerbang:', len(NAMA_GERBANG)); print('  nama:', NAMA_GERBANG)"
            python -c "from lux.backtest.gerbang import NAMA_GERBANG; assert 'konsentrasi' in NAMA_GERBANG and 'funding_ekor' in NAMA_GERBANG, 'gerbang ADR-010/ADR-011 tidak terdaftar'; print('gerbang kesepuluh dan kesebelas terdaftar: ya')"
            python -c "from lux.backtest.engine import Konfig; print('bawaan pengaman mati:', Konfig().maks_carry_realisasi_R == 0.0)"
            python -c "from lux.analisis.titik_impas import ALASAN_TIDAK_SELESAI, titik_impas; print('alasan tidak selesai:', ALASAN_TIDAK_SELESAI); print('  titik impas 4R', round(titik_impas(4.0), 4), '8R', round(titik_impas(8.0), 4))"
            python -c "from lux.backtest.run_h010 import AMBANG_CARRY_KERAS, IMBALAN, LOOKBACK, kandidat, spek_h010; from lux.backtest.run_h002 import muat_konfig_h002; k = muat_konfig_h002('config/lux.yaml'); s = spek_h010(k); print('H-010 siap:', s.h.id, s.nama, s.h.jumlah_kombinasi, 'kombinasi, sidik', s.h.sidik()[:12]); print('  lookback', LOOKBACK, 'imbalan', IMBALAN, 'kandidat', len(kandidat())); print('  ambang carry DIPATOK:', AMBANG_CARRY_KERAS); print('  saringan ADR-004 tetap:', k.maks_umur_bar, k.maks_carry_R, k.jendela_carry_hari)"
            python -c "from lux.backtest.run_h007 import IMBALAN as I7, LOOKBACK as L7; from lux.backtest.run_h009 import IMBALAN as I9, LOOKBACK as L9; assert I9 == I7 and L9 == L7, 'grid H-009 menyimpang dari H-007'; print('kontrak beku H-009 utuh: ya')"
            python -c "from lux.backtest.run_h007 import IMBALAN as I7, LOOKBACK as L7; from lux.backtest.run_h010 import IMBALAN as I10, JANGKAR, LOOKBACK as L10, kandidat; from lux.backtest.run_h009 import kandidat as k9; assert L10 == list(L7), 'lookback H-010 menyimpang'; assert I10 != list(I7), 'dinding tidak digeser, ADR-012 kosong'; assert len(I10) == len(I7), 'jumlah kombinasi berubah, multiplisitas tak sebanding'; assert max(I10) > max(I7), 'dinding digeser ke DALAM, bukan ke luar'; assert all(j in I10 for j in JANGKAR), 'jangkar pembanding hilang'; assert len(kandidat()) == len(k9()), 'kombinasi H-010 tidak sama dengan H-009'; print('ADR-012 ditegakkan: imbalan', list(I7), '->', I10, 'dengan', len(kandidat()), 'kombinasi')"
            python -c "from lux.backtest.run_h010 import AMBANG_CARRY_KERAS, KUNCI_TERLARANG, buat_konfig, kandidat; from lux.backtest.run_h009 import buat_konfig as bk9; from lux.backtest.run_h002 import muat_konfig_h002; k = muat_konfig_h002('config/lux.yaml'); assert buat_konfig is bk9, 'buat_konfig H-010 bukan fungsi H-009'; assert all(KUNCI_TERLARANG not in p for p in kandidat()), 'batas risiko bocor ke ruang pencarian'; assert AMBANG_CARRY_KERAS > 0, 'pengaman mati'; assert all(buat_konfig(p, k).maks_carry_realisasi_R == AMBANG_CARRY_KERAS for p in kandidat()), 'ada kandidat tanpa pengaman'; print('ADR-009 ditegakkan: pengaman menyala di', len(kandidat()), 'dari', len(kandidat()), 'kandidat')"
          } 2>&1 | tee -a logs/preflight.log

      - name: Unduh aset
        id: unduh
        if: always() && steps.impor.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p aset logs
          echo "=== unduh ===" >> logs/preflight.log
          gh release download "$TAG" -p 'ohlcv_1h_*.parquet' -D aset --clobber
          gh release download "$TAG" -p 'funding_shard*.parquet' -D aset --clobber
          ls -la aset | tail -20 2>&1 | tee -a logs/preflight.log
          du -sh aset 2>&1 | tee -a logs/preflight.log

      - name: Jalankan H-010 (dinding grid imbalan digeser)
        id: jalan
        if: always() && steps.unduh.outcome == 'success'
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p logs
          python -m lux.backtest.run_h010 \
            --dir aset \
            --interval 1h \
            --universe reports/universe_layak_v2.json \
            --akhir-sejati reports/akhir_sejati.json \
            --limit "${{ github.event.inputs.limit || 40 }}" \
            --ulangan "${{ github.event.inputs.ulangan || 100 }}" \
            --out reports 2>&1 | tee logs/backtest.log

      # Laporan ini WAJIB tetap terbentuk pada kegagalan apa pun, termasuk
      # kegagalan yang terjadi sebelum satu bita data pun diunduh. Tanpa itu,
      # satu-satunya cara mengetahui penyebabnya adalah menebak.
      - name: Salin log ke laporan
        if: always()
        run: |
          mkdir -p reports logs
          {
            echo "# Log run backtest H-010 (ADR-012)"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: \`${GITHUB_RUN_ID}\`"
            echo
            echo "| Langkah | Hasil |"
            echo "|---|---|"
            echo "| pasang dependensi | \`${{ steps.deps.outcome }}\` |"
            echo "| pytest | \`${{ steps.uji.outcome }}\` |"
            echo "| impor | \`${{ steps.impor.outcome }}\` |"
            echo "| unduh aset | \`${{ steps.unduh.outcome }}\` |"
            echo "| jalan | \`${{ steps.jalan.outcome }}\` |"
            echo
            echo "## Pra-terbang"
            echo
            echo '```'
            tail -c 20000 logs/preflight.log 2>/dev/null || echo "(logs/preflight.log tidak terbentuk sama sekali)"
            echo '```'
            echo
            echo "## Langkah jalan"
            echo
            echo '```'
            tail -c 60000 logs/backtest.log 2>/dev/null || echo "(tidak ada log; kegagalan terjadi sebelum langkah jalan)"
            echo '```'
          } > reports/backtest_log.md

      - name: Commit laporan kembali ke repo
        if: always()
        run: |
          git config user.name "lux-backtest"
          git config user.email "actions@github.com"
          git add reports || true
          git add hipotesis || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(backtest): laporan run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
