name: funding-check

# Menghitung ulang metrik funding dari Parquet yang sudah ada di Release.
#
# Tidak mengunduh ulang arsip Binance: datanya sudah benar, yang cacat adalah
# rumus celahnya. Membedakan "data salah" dari "metrik salah" menentukan apakah
# perbaikan berharga dua puluh menit atau satu menit.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/funding_check.yml'

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt pytest

      - name: Uji dulu, baru unduh
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Ambil Parquet funding dari release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p aset
          gh release download "$TAG" -p 'funding_shard*.parquet' -D aset
          ls -la aset

      - name: Hitung ulang metrik
        env:
          PYTHONPATH: .
        run: python -m lux.funding_check --dir aset --universe reports/universe_layak.json

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-funding"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "data(funding): pemeriksaan ulang run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
