name: funding

# S5b. Funding rate untuk 447 simbol yang lolos ambang kelayakan.
#
# Diambil hanya untuk universe layak, bukan seluruh 790 simbol, karena data
# yang tidak akan pernah diuji tidak layak dibayar dengan waktu runner.
#
# Percobaan 2. Percobaan 1 mati di gerbang pengujian dalam 49 detik: berkas
# funding berheader tanpa baris data membuat pandas melempar EmptyDataError,
# dan karena galat itu ditangkap di tingkat bulan, satu berkas kosong akan
# menandai seluruh bulan sebagai gagal. Bulan tanpa funding memang ada, jadi
# keadaan itu sah dan kini dikembalikan sebagai frame kosong.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/funding.yml'

permissions:
  contents: write

env:
  TAG: tier-b-v1
  SHARDS: 4

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt pytest

      - name: Uji parser sebelum mengunduh apa pun
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Ingest funding shard ${{ matrix.shard }}
        env:
          PYTHONPATH: .
        run: |
          python -m lux.funding \
            --shard ${{ matrix.shard }} \
            --shards ${{ env.SHARDS }} \
            --universe reports/universe_layak.json \
            --workers 6 \
            --out out

      - name: Unggah Parquet ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          berkas=(out/*.parquet)
          if [ ${#berkas[@]} -gt 0 ]; then
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "Tier B" --notes "Aset Parquet Tier B."
            gh release upload "$TAG" "${berkas[@]}" --clobber
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: laporan-funding-${{ matrix.shard }}
          path: out/*.json
          retention-days: 7

  gabung:
    needs: funding
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: laporan-funding-*
          merge-multiple: true
          path: shards
      - name: Gabungkan laporan
        env:
          PYTHONPATH: .
        run: python -m lux.funding --merge shards
      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-funding"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "data(funding): laporan funding run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
