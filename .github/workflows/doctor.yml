name: doctor

# Mengukur kapasitas runner dan konektivitas sumber data, lalu MENULIS HASILNYA
# KEMBALI ke repo. Agen tidak punya kemampuan membaca log workflow, jadi commit
# balik adalah satu-satunya jalur umpan balik yang tersedia.
#
# Angka di STATE.md bagian "asumsi" hanya boleh naik ke bagian "fakta"
# setelah muncul di reports/.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/doctor.yml'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ukur kapasitas dan konektivitas
        run: |
          # Sengaja tidak memakai set -e. Kegagalan probe adalah DATA, bukan
          # alasan menghentikan job. Setiap kegagalan harus sampai ke laporan.
          set +e
          mkdir -p reports /tmp/dl

          FNAME="BTCUSDT-1h-2024-01.zip"
          BASE="https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1h"
          URL="$BASE/$FNAME"
          S3="https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"

          VCPU=$(nproc)
          RAM_GB=$(free -g | awk '/^Mem:/{print $2}')
          RAM_H=$(free -h | awk '/^Mem:/{print $2}')
          DISK_GB=$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          DISK_TABLE=$(df -h | grep -E '^/dev|Filesystem')
          CPU_MODEL=$(lscpu | grep 'Model name' | sed 's/.*: *//')

          # --- Probe 1: HEAD ke CDN ---
          HEAD_CODE=$(curl -sSIL -o /dev/null -w '%{http_code}' --max-time 60 "$URL")

          # --- Probe 2: unduhan nyata ---
          # PENTING: berkas HARUS disimpan dengan nama aslinya. Berkas .CHECKSUM
          # memuat nama berkas, sehingga sha256sum -c gagal bila namanya diubah.
          # Run sebelumnya melaporkan checksum_ok=false murni karena bug ini.
          DL=$(curl -sS -o "/tmp/dl/$FNAME" -w '%{size_download} %{time_total}' --max-time 300 "$URL")
          DL_BYTES=$(echo "$DL" | awk '{print $1}')
          DL_SECS=$(echo "$DL" | awk '{print $2}')
          [ -z "$DL_BYTES" ] && DL_BYTES=0
          [ -z "$DL_SECS" ] && DL_SECS=0

          # --- Probe 3: verifikasi checksum ---
          curl -sS --max-time 60 "$URL.CHECKSUM" -o "/tmp/dl/$FNAME.CHECKSUM"
          CKS_OK=false
          ( cd /tmp/dl && sha256sum -c "$FNAME.CHECKSUM" > /tmp/cks.txt 2>&1 ) && CKS_OK=true
          CKS_OUT=$(head -3 /tmp/cks.txt 2>/dev/null)

          # --- Probe 4: throughput pada berkas besar ---
          # Berkas 1h sangat kecil sehingga waktunya didominasi latensi, bukan
          # bandwidth. Berkas 1m dipakai untuk mengukur throughput sebenarnya,
          # karena inilah yang menentukan anggaran waktu ingest Tier A.
          BIG="BTCUSDT-1m-2024-01.zip"
          BIGURL="https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m/$BIG"
          BD=$(curl -sS -o "/tmp/dl/$BIG" -w '%{size_download} %{time_total}' --max-time 300 "$BIGURL")
          BIG_BYTES=$(echo "$BD" | awk '{print $1}')
          BIG_SECS=$(echo "$BD" | awk '{print $2}')
          [ -z "$BIG_BYTES" ] && BIG_BYTES=0
          [ -z "$BIG_SECS" ] && BIG_SECS=0
          MBPS=$(awk -v b="$BIG_BYTES" -v s="$BIG_SECS" 'BEGIN{if(s>0)printf "%.2f", (b/1048576)/s; else print 0}')

          # --- Probe 5: bongkar dan periksa skema CSV ---
          RAW_BYTES=0; ROWS=0; HEADLINE=""; RATIO="0"
          rm -rf /tmp/probe && mkdir -p /tmp/probe
          unzip -o -q "/tmp/dl/$FNAME" -d /tmp/probe 2>/dev/null
          CSV=$(ls /tmp/probe/*.csv 2>/dev/null | head -1)
          if [ -n "$CSV" ]; then
            RAW_BYTES=$(stat -c %s "$CSV")
            ROWS=$(wc -l < "$CSV")
            HEADLINE=$(head -1 "$CSV")
            RATIO=$(awk -v r="$RAW_BYTES" -v z="$DL_BYTES" 'BEGIN{if(z>0)printf "%.2f", r/z; else print 0}')
          fi

          # --- Probe 6: REST exchangeInfo ---
          EI_CODE=$(curl -sS -o /tmp/ei.json -w '%{http_code}' --max-time 60 https://fapi.binance.com/fapi/v1/exchangeInfo)
          EI_SYM=$(python3 -c "import json;print(len(json.load(open('/tmp/ei.json'))['symbols']))" 2>/dev/null)
          [ -z "$EI_SYM" ] && EI_SYM=null

          cat > reports/doctor.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "waktu_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runner": {
              "vcpu": ${VCPU},
              "ram_gb": ${RAM_GB},
              "disk_avail_gb": ${DISK_GB},
              "cpu_model": "${CPU_MODEL}"
            },
            "cdn": {
              "head_http": "${HEAD_CODE}",
              "download_bytes": ${DL_BYTES},
              "download_seconds": ${DL_SECS},
              "checksum_ok": ${CKS_OK},
              "csv_bytes": ${RAW_BYTES},
              "csv_rows": ${ROWS},
              "zip_ratio": ${RATIO},
              "big_file_bytes": ${BIG_BYTES},
              "big_file_seconds": ${BIG_SECS},
              "throughput_mib_per_s": ${MBPS}
            },
            "exchange_info": {
              "http": "${EI_CODE}",
              "symbols": ${EI_SYM}
            }
          }
          EOF

          {
            echo "# Laporan doctor"
            echo
            echo "Run \`${GITHUB_RUN_ID}\` pada commit \`${GITHUB_SHA}\`, $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "## Kapasitas runner"
            echo
            echo "| Sumber daya | Nilai |"
            echo "|---|---|"
            echo "| vCPU | ${VCPU} |"
            echo "| RAM | ${RAM_H} |"
            echo "| Disk bebas | ${DISK_GB} GB |"
            echo "| CPU | ${CPU_MODEL} |"
            echo
            echo '```'
            echo "${DISK_TABLE}"
            echo '```'
            echo
            echo "## Binance Vision CDN"
            echo
            echo "- HEAD: \`${HEAD_CODE}\`"
            echo "- Berkas 1h: ${DL_BYTES} byte dalam ${DL_SECS} detik"
            echo "- Checksum cocok: **${CKS_OK}**"
            echo "- Berkas 1m: ${BIG_BYTES} byte dalam ${BIG_SECS} detik, throughput ${MBPS} MiB/s"
            echo "- CSV hasil bongkar: ${RAW_BYTES} byte, ${ROWS} baris, rasio ${RATIO}x"
            echo "- Baris pertama CSV:"
            echo '```'
            echo "${HEADLINE}"
            echo '```'
            echo "- Keluaran sha256sum:"
            echo '```'
            echo "${CKS_OUT}"
            echo '```'
            echo
            echo "## REST exchangeInfo"
            echo
            echo "- HTTP \`${EI_CODE}\`, simbol: ${EI_SYM}"
            echo "- Kode 451 berarti diblokir atas dasar hukum. Runner GitHub berbasis di AS."
          } > reports/doctor.md

          cat reports/doctor.md
          exit 0

      - name: Probe universe dari S3 listing
        run: |
          # Ini menjawab pertanyaan terpenting yang masih terbuka: berapa banyak
          # simbol yang PERNAH ada, bukan yang aktif hari ini. Karena exchangeInfo
          # diblokir dari runner, arsip S3 adalah satu-satunya sumber universe.
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET

          S3 = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
          NS = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}
          out = {"ok": False}

          def listing(prefix, delimiter="/"):
              token, prefixes, keys = None, [], []
              while True:
                  q = {"list-type": "2", "max-keys": "1000",
                       "prefix": prefix, "delimiter": delimiter}
                  if token:
                      q["continuation-token"] = token
                  url = S3 + "?" + urllib.parse.urlencode(q)
                  with urllib.request.urlopen(url, timeout=90) as r:
                      root = ET.fromstring(r.read())
                  prefixes += [e.text for e in root.findall("s3:CommonPrefixes/s3:Prefix", NS)]
                  keys += [e.text for e in root.findall("s3:Contents/s3:Key", NS)]
                  if root.findtext("s3:IsTruncated", "false", NS) != "true":
                      break
                  token = root.findtext("s3:NextContinuationToken", None, NS)
                  if not token:
                      break
              return prefixes, keys

          try:
              base = "data/futures/um/monthly/klines/"
              prefixes, _ = listing(base)
              symbols = sorted(p[len(base):].strip("/") for p in prefixes)
              out["total_symbols_pernah_ada"] = len(symbols)
              out["contoh_20"] = symbols[:20]

              # Simbol yang sudah delisted. Kehadirannya membuktikan arsip tidak
              # menderita survivorship bias.
              cek = ["SRMUSDT", "FTTUSDT", "COCOSUSDT", "BTSUSDT",
                     "SCUSDT", "RAYUSDT", "HNTUSDT", "TOMOUSDT", "CVCUSDT"]
              hadir = {}
              for s in cek:
                  if s not in symbols:
                      hadir[s] = {"ada": False}
                      continue
                  _, keys = listing(f"{base}{s}/1h/")
                  bulan = sorted(k.rsplit("/", 1)[-1] for k in keys if k.endswith(".zip"))
                  hadir[s] = {"ada": True, "jumlah_bulan": len(bulan),
                              "pertama": bulan[0] if bulan else None,
                              "terakhir": bulan[-1] if bulan else None}
              out["probe_delisted"] = hadir

              _, btc = listing(f"{base}BTCUSDT/1h/")
              zips = [k for k in btc if k.endswith(".zip")]
              out["btcusdt_1h_bulan"] = len(zips)

              out["ok"] = True
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"

          with open("reports/universe_probe.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print(json.dumps(out, indent=2, ensure_ascii=False)[:4000])
          PYEOF
          exit 0

      - name: Commit laporan kembali ke repo
        run: |
          set -e
          git config user.name "lux-doctor"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan laporan."
            exit 0
          fi
          git commit -m "chore(doctor): laporan run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
