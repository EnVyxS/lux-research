name: diagnose

# Mengunduh ulang artifact dari run ingest terakhir dan membangun ulang
# laporannya dengan lux.summarize versi terbaru.
#
# Ini juga menutup keterbatasan yang selama ini menyulitkan: agen tidak bisa
# membaca log maupun artifact workflow lewat API yang tersedia. Runner bisa,
# lewat gh CLI. Jadi runner yang mengambilnya, lalu meng-commit hasilnya ke
# repo supaya agen bisa membacanya seperti berkas biasa.
#
# Jauh lebih murah daripada menjalankan ulang ingest hanya untuk mengetahui
# simbol mana yang gagal.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unduh artifact run ingest terakhir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN=$(gh run list --workflow=ingest_tier_b.yml --limit 1 \
                  --json databaseId --jq '.[0].databaseId')
          echo "run ingest terakhir: $RUN"
          echo "run_id=$RUN" >> "$GITHUB_ENV"
          mkdir -p shards
          gh run download "$RUN" -p 'laporan-shard-*' -D shards || \
            echo "peringatan: artifact tidak dapat diunduh"
          find shards -name '*.json' | head -40
          echo "jumlah berkas detail: $(find shards -name 'detail_*.json' | wc -l)"

      - name: Bangun ulang laporan
        env:
          PYTHONPATH: .
        run: python -m lux.summarize shards ingest_tier_b

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-diagnose"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "chore(diagnose): laporan ingest diperkaya dari run ${run_id} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
