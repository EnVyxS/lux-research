name: ingest-tier-b

# S4 — ingest kline 1h dan 4h untuk seluruh universe perpetual USDT.
#
# Tiga keputusan struktural:
#
# 1. Parquet diunggah sebagai aset GitHub Release, bukan di-commit ke git.
#    Repo git tidak dirancang untuk biner besar, dan batas berkas 100 MB akan
#    tertabrak. Release mengizinkan 2 GB per berkas.
# 2. Shard berjalan paralel, tapi hanya SATU job yang meng-commit laporan.
#    Delapan job yang push ke branch sama akan saling menimpa.
# 3. Gerbang ditegakkan setelah laporan tersimpan, supaya bukti kegagalan tetap
#    ada di repo alih-alih hilang bersama job yang merah.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ingest_tier_b.yml'

permissions:
  contents: write

env:
  TAG: tier-b-v1
  SHARDS: 8

jobs:
  siapkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan release penampung
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Tier B — OHLCV 1h dan 4h" \
              --notes "Aset Parquet hasil ingest Tier B. Dihasilkan otomatis oleh workflow ingest-tier-b."
          fi

  ingest:
    needs: siapkan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Ingest shard ${{ matrix.shard }}
        env:
          PYTHONPATH: .
        run: |
          python -m lux.ingest \
            --shard ${{ matrix.shard }} \
            --shards ${{ env.SHARDS }} \
            --intervals 1h,4h \
            --quote USDT \
            --workers 6 \
            --out out

      - name: Unggah Parquet ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          berkas=(out/*.parquet)
          if [ ${#berkas[@]} -gt 0 ]; then
            gh release upload "$TAG" "${berkas[@]}" --clobber
          else
            echo "tidak ada parquet dihasilkan"
          fi

      - name: Simpan laporan shard
        uses: actions/upload-artifact@v4
        with:
          name: laporan-shard-${{ matrix.shard }}
          path: out/*.json
          retention-days: 7

  gabung:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          pattern: laporan-shard-*
          merge-multiple: true
          path: shards

      - name: Gabungkan laporan
        id: gabung
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m lux.summarize shards
          echo "kode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-ingest"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "data(ingest): laporan Tier B run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Tegakkan gerbang
        run: |
          if [ "${{ steps.gabung.outputs.kode }}" != "0" ]; then
            echo "Agregasi gagal. Lihat reports/ingest_tier_b.json."
            exit 1
          fi
