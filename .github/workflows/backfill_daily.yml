name: backfill-daily

# Menutup bulan yang tidak tercakup arsip bulanan, memakai arsip harian.
# Dijalankan SETELAH ingest Tier B selesai, dan diulang berkala karena arsip
# bulanan akan selalu tertinggal sekitar satu bulan.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill_daily.yml'
  schedule:
    # Setiap Senin 02:00 UTC. Juga berfungsi menjaga cron tetap hidup, karena
    # workflow terjadwal di repo publik dinonaktifkan otomatis setelah 60 hari
    # tanpa aktivitas.
    - cron: '0 2 * * 1'

permissions:
  contents: write

env:
  TAG: tier-b-v1
  SHARDS: 4

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Backfill shard ${{ matrix.shard }}
        env:
          PYTHONPATH: .
        run: |
          python -m lux.backfill_daily \
            --shard ${{ matrix.shard }} \
            --shards ${{ env.SHARDS }} \
            --intervals 1h,4h \
            --quote USDT \
            --workers 6 \
            --out out

      - name: Unggah Parquet ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          berkas=(out/*.parquet)
          if [ ${#berkas[@]} -gt 0 ]; then
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "Tier B" --notes "Aset Parquet Tier B."
            gh release upload "$TAG" "${berkas[@]}" --clobber
          else
            echo "tidak ada parquet dihasilkan"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: laporan-tail-${{ matrix.shard }}
          path: out/*.json
          retention-days: 7

  gabung:
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: laporan-tail-*
          merge-multiple: true
          path: shards
      - name: Gabungkan laporan
        env:
          PYTHONPATH: .
        run: python -m lux.summarize shards backfill_daily
      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-backfill"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "data(backfill): laporan ekor harian run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
