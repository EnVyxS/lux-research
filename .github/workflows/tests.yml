name: tests

# Jaring pengaman untuk kode yang tidak menyentuh jaringan.
#
# Cacat URL non-ASCII kemarin lolos justru karena tidak ada satu pun pengujian
# yang berjalan sebelum job berdurasi delapan belas menit dimulai. Pengujian
# murni-logika berjalan dalam hitungan detik dan menangkap kelas kesalahan itu
# jauh lebih murah.

on:
  workflow_dispatch:
  push:
    paths:
      - 'lux/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: write

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt pytest

      - name: Jalankan pytest
        id: pytest
        env:
          PYTHONPATH: .
        run: |
          set +e
          mkdir -p reports
          python -m pytest tests -q --tb=short > /tmp/pytest.txt 2>&1
          kode=$?
          set -e
          tail -n 60 /tmp/pytest.txt
          {
            echo "# Laporan pengujian"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Kode keluar: \`${kode}\`"
            echo
            echo '```'
            tail -n 80 /tmp/pytest.txt
            echo '```'
          } > reports/tests.md
          echo "kode=${kode}" >> "$GITHUB_OUTPUT"

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-tests"
          git config user.email "actions@github.com"
          git add reports/tests.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(tests): laporan pengujian ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Tegakkan hasil
        if: steps.pytest.outputs.kode != '0'
        run: |
          echo "pengujian gagal"
          exit 1
