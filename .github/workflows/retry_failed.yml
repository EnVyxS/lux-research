name: retry-failed

# Menambal simbol yang gagal pada ingest Tier B putaran pertama.
#
# Ketiganya gagal bukan karena datanya tidak ada, melainkan karena namanya
# memakai huruf Han sehingga URL CDN yang belum di-percent-encode ditolak oleh
# urllib. Menjalankan ulang seluruh 790 simbol untuk menambal tiga simbol
# adalah pemborosan, jadi jalur ini hanya menyentuh yang gagal.
#
# Keluarannya diberi akhiran _retry supaya tidak menimpa aset shard penuh yang
# sudah ada di release.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/retry_failed.yml'

permissions:
  contents: write

env:
  TAG: tier-b-v1

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Ingest simbol yang sebelumnya gagal
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        run: |
          python -m lux.ingest \
            --symbols "币安人生USDT,我踏马来了USDT,龙虾USDT" \
            --intervals 1h,4h \
            --workers 3 \
            --suffix _retry \
            --out out

      - name: Unggah Parquet ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          berkas=(out/*.parquet)
          if [ ${#berkas[@]} -gt 0 ]; then
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "Tier B" --notes "Aset Parquet Tier B."
            gh release upload "$TAG" "${berkas[@]}" --clobber
          else
            echo "tidak ada parquet dihasilkan"
          fi

      - name: Bangun laporan
        env:
          PYTHONPATH: .
        run: |
          mkdir -p shards
          cp out/*.json shards/ 2>/dev/null || true
          python -m lux.summarize shards ingest_retry

      - name: Commit laporan
        run: |
          set -e
          git config user.name "lux-retry"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "data(retry): tambalan simbol non-ASCII run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
