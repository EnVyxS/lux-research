# Konfigurasi tunggal LUX.
#
# Semua angka yang memengaruhi hasil backtest harus berada di sini, bukan
# tersebar sebagai konstanta di dalam kode. Alasannya bukan kerapian: parameter
# yang tersembunyi di kode adalah cara paling umum overfitting menyelinap masuk
# tanpa disadari, karena tidak ada yang mencatat kapan ia diubah.
#
# Setiap perubahan pada berkas ini WAJIB tercatat di journal/ beserta alasannya.
#
# Dua kunci ADR-014 ditambahkan 2026-07-26 (universe.min_median_stop_frac dan
# risiko.maks_biaya_masuk_R). Satu kunci ADR-016 ditambahkan pada hari yang sama
# (risiko.stop_hormati_celah), dan satu kunci ADR-017 menyusul
# (universe.min_bar_4h). Nomor `versi` sengaja TIDAK dinaikkan: saya belum
# memeriksa setiap pembaca berkas ini dalam sesi ini, jadi menaikkannya adalah
# perubahan yang akibatnya tidak saya ketahui. Bila kelak ada modul yang
# menegakkan nomor versi, kenaikannya dikerjakan sebagai perubahan sendiri dan
# dijurnalkan.

versi: 2

universe:
  quote: USDT
  jenis_kontrak: perp
  # Instrumen dengan riwayat terlalu pendek tidak dapat diuji secara bermakna:
  # tidak cukup untuk walk-forward maupun untuk mengukur perilaku lintas rezim.
  min_bar_1h: 8760          # kira-kira satu tahun
  # ADR-017, dibekukan 2026-07-26 SEBELUM satu byte data 4h pernah dibaca.
  #
  # Yang dibekukan adalah MAKNANYA, bukan angkanya: lantai riwayat tetap satu
  # tahun kalender untuk setiap interval. 2190 = 8760 / 4, dihitung bukan
  # ditaksir.
  #
  # Mengapa kunci ini ada. `lux/validate_run.py` dahulu membaca `min_bar_1h`
  # APA PUN intervalnya. Dipakai untuk 4h, 8.760 bar berhenti berarti satu tahun
  # dan berubah menjadi EMPAT TAHUN, sehingga semesta 4h akan menyusut tajam
  # oleh satuan yang diwarisi diam-diam — dan penyusutan itu akan tampak sebagai
  # temuan tentang pasar. H-011 sudah sekali gugur karena definisi semesta,
  # bukan karena sinyal; sekali cukup.
  #
  # `muat_ambang` kini gagal keras bila kunci `min_bar_<interval>` tidak ada.
  # Tidak ada nilai bawaan tersembunyi, sebab jatuh diam-diam ke lantai 1h
  # adalah tepat cacat yang kunci ini perbaiki.
  min_bar_4h: 2190          # satu tahun pada bar empat jam
  # Ambang likuiditas memakai median nilai transaksi harian, bukan volume koin,
  # supaya sebanding antar instrumen dengan harga sangat berbeda. Satuannya per
  # hari, jadi ia tidak ikut berubah makna ketika interval berganti.
  min_median_quote_volume_harian: 1000000
  # Bar datar berlebihan menandakan harga tidak bergerak sama sekali; strategi
  # apa pun yang untung di sana kemungkinan besar mengeksploitasi cacat data.
  #
  # ADR-017 mencatat keberatan yang belum dikompensasi: satu bar 4h hanya datar
  # bila keempat bar 1h penyusunnya datar, jadi rasio bar datar 4h umumnya LEBIH
  # KECIL daripada 1h untuk simbol yang sama, dan ambang 0,30 karena itu bekerja
  # LEBIH LONGGAR pada 4h. Angkanya sengaja tidak digeser — menggeser ambang
  # tanpa bukti hanya memindahkan kesewenangan. Yang menjaga sisi ini adalah
  # lantai min_median_stop_frac di bawah, ditambah kewajiban laporan menyebut
  # jumlah simbol terbuang per sebab.
  maks_rasio_bar_datar: 0.30
  # ADR-014, dibekukan 2026-07-26 SEBELUM H-012 dijalankan. Lantai jarak stop
  # sebagai pecahan harga, diukur dengan MEDIAN sepanjang riwayat simbol.
  #
  # Mengapa kunci ini ada. Ketiga kriteria di atas tidak satu pun menyentuh
  # volatilitas, dan USDCUSDT lolos ketiganya dengan mudah: umurnya panjang,
  # volumenya besar sekali, dan barnya tidak datar dalam arti harga-tak-berubah.
  # Padahal ATR/harga-nya praktis nol, sehingga stop_frac mencapai 3,1984e-06,
  # biaya satu perdagangan menjadi 312,73R di laporan H-011, dan gerbang
  # invarian_risiko melaporkan -470,06R terhadap ambang -1,5R. Satuan R berhenti
  # bermakna ketika jarak stop mendekati nol, sebab setiap biaya dinyatakan
  # dengan MEMBAGI jarak itu dan pembagian itu tidak punya batas bawah.
  #
  # Mengapa 0,004 dan bukan angka lain. Ia diturunkan, bukan disetel: biaya
  # bolak-balik 2*(fee_efektif + slippage) = 0,002 dari harga menjadi tepat
  # 0,5R pada jarak stop 0,004, karena 0,002 / 0,004 = 0,5. Di bawah lantai itu
  # biaya memakan lebih dari separuh satuan risiko.
  #
  # Lantai ini adalah KRITERIA KELAYAKAN SEMESTA yang seragam, bukan pembuangan
  # simbol sesudah hasilnya terlihat. Membuang USDCUSDT karena hasilnya buruk
  # adalah penyubsetan pasca-hasil yang dilarang ADR-013 bagian 8; aturan yang
  # ditulis lebih dulu dan berlaku bagi simbol mana pun, termasuk simbol yang
  # belum ada hari ini, adalah satu-satunya bentuk yang sah.
  #
  # DILARANG menaikkan maupun menurunkan angka ini sesudah hasil H-012 terlihat.
  min_median_stop_frac: 0.004

biaya:
  fee_maker: 0.0002
  fee_taker: 0.0005
  # Diasumsikan masuk dan keluar dengan market order sampai terbukti sebaliknya.
  # Asumsi pesimistis adalah satu-satunya asumsi yang aman soal biaya.
  fee_efektif: 0.0005
  slippage: 0.0005
  # Kunci `funding_interval_jam: 8` DIHAPUS pada 2026-07-26. Kisi tetap delapan
  # jam terbukti salah untuk mayoritas universe: 269 dari 447 simbol layak
  # berkisi empat jam dan 295 simbol hidup di lebih dari satu rezim kisi
  # (reports/funding_check.md @ 0448a67). Pembagi tetap menagih setengah dari
  # yang seharusnya, dan karena 79,1% periode funding bernilai positif,
  # kekurangan tagihan itu langsung menjadi keuntungan palsu bagi strategi yang
  # condong long. Jalur backtest menjumlahkan peristiwa penagihan nyata lewat
  # lux/funding_model.py.
  funding_dari_jadwal_nyata: true

risiko:
  atr_periode: 14
  atr_pengali_stop: 2.0
  risiko_per_trade: 0.005
  # ADR-004, dipakai HANYA oleh hipotesis H-002 (lux/backtest/run_h002.py).
  # run_wf.py yang menjalankan H-001b tidak membaca ketiga kunci ini, sehingga
  # hasil H-001b tetap dapat diulang persis.
  maks_umur_bar: 168        # tujuh hari pada bar 1 jam
  maks_carry_R: 0.25        # seperempat risiko yang dipertaruhkan
  jendela_carry_hari: 30
  # ADR-014, dibekukan 2026-07-26 SEBELUM H-012 dijalankan. Pagar risiko di
  # mesin: entri yang biaya bolak-baliknya melebihi angka ini, dinyatakan dalam
  # satuan R, DITOLAK dan tidak menjadi perdagangan.
  #
  # Ini pasangan aritmetika dari universe.min_median_stop_frac di atas, bukan
  # angka kedua yang berdiri sendiri: keduanya bertemu tepat di titik batas,
  # sehingga median tepat di lantai diterima dan entri tepat di lantai tidak
  # ditolak. Sejenis dengan maks_carry_R: batas risiko DIPATOK, tidak pernah
  # dilombakan di dalam walk-forward (ADR-009 — pemaksimal ekspektasi akan
  # selalu mematikan pengaman yang memakan ekspektasi bila diberi pilihan).
  #
  # Bawaan Konfig.maks_biaya_masuk_R di lux/backtest/engine.py tetap 0,0 yang
  # berarti MATI, dan itu dikunci pengujian. Angka di sini hanya menyala bila
  # orkestrator hipotesis memasangnya secara eksplisit.
  #
  # DILARANG menurunkan angka ini sesudah hasil H-012 terlihat.
  maks_biaya_masuk_R: 0.5
  # ADR-016, ditambahkan 2026-07-26 SESUDAH H-012 divonis dan SEBELUM H-013
  # dirancang. Ini bukan ambang yang dapat disetel melainkan sakelar kejujuran
  # eksekusi, jadi tidak ada angka yang bisa dilombakan di sini.
  #
  # Mengapa kunci ini ada. Sebelum ADR-016 mesin selalu mengisi stop tepat di
  # harga stop, bahkan ketika bar MEMBUKA jauh melewatinya. Akibatnya mesin
  # mustahil melahirkan stop lebih buruk dari sekitar 1R ditambah biaya, dan
  # gerbang invarian_risiko praktis tidak punya daya pada jalur stop: ia hanya
  # dapat dijatuhkan oleh umur, carry, dan akhir_data, yaitu tiga jalur yang
  # mengisi pada harga bar sungguhan. Itulah sebab satu-satunya pelanggar ambang
  # di H-012, -21,3131R pada STGUSDT, muncul lewat carry
  # (reports/geometri_keluar_h012.md, run 30209272338).
  #
  # Target sengaja TIDAK diperlakukan simetris: ia tetap terisi di harga target
  # walau bar membuka melewatinya, sebab celah yang menguntungkan adalah hadiah
  # atas ketidaktahuan.
  #
  # Menyalakan kunci ini MEMPERBURUK setiap angka hasil. Bila suatu saat ia
  # memperbaiki angka, yang ditemukan adalah cacat tanda, bukan keunggulan.
  #
  # Bawaan Konfig.stop_hormati_celah di engine.py tetap False yang berarti MATI,
  # dan itu dikunci pengujian. Hasil H-001b sampai H-012 TIDAK dihitung ulang:
  # menghitung ulang vonis dengan mesin berbeda akan mencampur dua mesin di
  # dalam satu papan skor.
  stop_hormati_celah: true

validasi:
  seed: 42
  # Ambang minimum keunggulan terhadap pembanding. Strategi yang tidak melewati
  # ini dianggap tidak ada, bukan "menjanjikan".
  min_keunggulan_vs_buy_hold: 0.0
  min_trade_untuk_dinilai: 100
